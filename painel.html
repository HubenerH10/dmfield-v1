<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Acompanhamento DM · Bandeirantes</title>
<meta name="theme-color" content="#0E1015">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root, html[data-tema="escuro"]{
  --bg:#0E1015; --painel:#161922; --painel-2:#1C2029; --borda:#262B36;
  --texto:#EDEFF3; --texto-2:#9BA3B0; --texto-3:#6B7382;
  --vermelho:#E4002B; --vermelho-fundo:rgba(228,0,43,.14);
  --azul:#3B9EDB; --azul-fundo:rgba(59,158,219,.14);
  --verde:#27AE60; --verde-fundo:rgba(39,174,96,.14);
  --ambar:#E8A33D; --ambar-fundo:rgba(232,163,61,.14);
}
html[data-tema="claro"]{
  --bg:#F4F5F7; --painel:#FFFFFF; --painel-2:#F7F8FA; --borda:#E3E6EA;
  --texto:#16181C; --texto-2:#5C646E; --texto-3:#858D98;
  --vermelho:#CB0028; --vermelho-fundo:rgba(203,0,40,.08);
  --azul:#1B6FA8; --azul-fundo:rgba(27,111,168,.10);
  --verde:#0E7A3C; --verde-fundo:rgba(14,122,60,.10);
  --ambar:#9A6400; --ambar-fundo:rgba(154,100,0,.10);
}
html[data-tema="claro"] .painel,
html[data-tema="claro"] .kpi{box-shadow:0 1px 2px rgba(22,24,28,.05)}
html[data-tema="claro"] nav{box-shadow:0 -1px 3px rgba(22,24,28,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--texto);font-size:14px;line-height:1.5;
  padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button,select{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.oculto{display:none!important}
::-webkit-scrollbar{height:6px;width:6px}
::-webkit-scrollbar-thumb{background:var(--borda);border-radius:6px}

.topo{background:var(--painel);border-bottom:1px solid var(--borda);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30}
.logo{background:var(--vermelho);border-radius:8px;padding:7px 10px;flex:0 0 auto;
  font-weight:800;font-size:12px;letter-spacing:.06em;color:#fff;line-height:1.1;text-align:center}
.logo span{display:block;font-weight:500;font-size:9px;letter-spacing:.14em;opacity:.9}
.topo h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em;flex:1;min-width:0}
.topo .quando{font-size:11px;color:var(--texto-3);text-align:right;line-height:1.35}
.topo .quando b{color:var(--texto-2);font-weight:600}
.recarrega{background:var(--painel-2);border:1px solid var(--borda);border-radius:7px;
  padding:7px 9px;color:var(--texto-2);flex:0 0 auto}
.recarrega svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;display:block}

.filtros{padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  border-bottom:1px solid var(--borda);background:var(--bg)}
.campo{background:var(--painel);border:1px solid var(--borda);border-radius:8px;
  padding:9px 12px;display:flex;align-items:center;gap:8px;min-width:0}
.campo label{font-size:10.5px;color:var(--texto-3);letter-spacing:.04em}
.campo select{font-size:14px;font-weight:600;appearance:none;padding-right:14px;max-width:160px}
.campo select option{background:var(--painel);color:var(--texto)}
.tag-fonte{margin-left:auto;font-size:11px;color:var(--texto-3);display:flex;align-items:center;gap:6px}
.ponto{width:7px;height:7px;border-radius:50%;background:var(--verde);flex:0 0 auto}
.ponto.frio{background:var(--ambar)}

main{padding:16px 16px 24px;max-width:1100px;margin:0 auto}
.faixa{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--painel);border:1px solid var(--borda);border-radius:10px;padding:14px}
.kpi .rot{font-size:11px;color:var(--texto-3);margin-bottom:6px}
.kpi .val{font-size:27px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.kpi .pe{font-size:11.5px;color:var(--texto-2);margin-top:5px}
.kpi.destaque{border-color:rgba(228,0,43,.4)}
.kpi.destaque .val{color:var(--vermelho)}
.kpi.ok .val{color:var(--verde)}

.painel{background:var(--painel);border:1px solid var(--borda);border-radius:10px;
  margin-bottom:16px;overflow:hidden}
.painel > h2{margin:0;padding:14px 16px;font-size:14px;font-weight:650;
  border-bottom:1px solid var(--borda);display:flex;align-items:center;gap:10px}
.painel > h2 small{font-weight:400;font-size:11.5px;color:var(--texto-3);margin-left:auto}
.corpo{padding:14px 16px}
.rolagem{overflow-x:auto}

table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th{text-align:left;font-size:10.5px;letter-spacing:.05em;color:var(--texto-3);
  font-weight:600;padding:10px 12px;background:var(--painel-2);border-bottom:1px solid var(--borda)}
td{padding:11px 12px;border-bottom:1px solid var(--borda);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.eu td{background:var(--vermelho-fundo)}
tr.total td{background:var(--painel-2);font-weight:700}
td.n,th.n{text-align:right}
td.nome{font-weight:600;white-space:normal}
.mini{color:var(--texto-3);font-size:11.5px;font-weight:400}

.selo{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.selo.ok{background:var(--verde-fundo);color:var(--verde)}
.selo.esperando{background:var(--ambar-fundo);color:var(--ambar)}
.selo.alerta{background:var(--vermelho-fundo);color:#FF6B85}
.selo.neutro{background:var(--azul-fundo);color:var(--azul)}

.prog{height:5px;background:var(--painel-2);border-radius:99px;overflow:hidden;min-width:64px;margin-top:5px}
.prog i{display:block;height:100%;background:var(--azul);border-radius:99px;
  transition:width .4s cubic-bezier(.2,.7,.3,1)}
.prog i.ok{background:var(--verde)}
.prog i.baixo{background:var(--vermelho)}

.metaLinha{padding:12px 0;border-bottom:1px solid var(--borda)}
.metaLinha:last-child{border-bottom:0}
.metaTopo{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.metaTopo b{font-size:13.5px;font-weight:650}
.metaTopo .n{font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px}
.metaTopo .n i{font-style:normal;color:var(--texto-3);font-weight:500}
.metaPe{display:flex;justify-content:space-between;font-size:11.5px;color:var(--texto-3);margin-top:5px}

.vazio{padding:32px 20px;text-align:center;color:var(--texto-2)}
.vazio b{display:block;color:var(--texto);font-size:15px;margin-bottom:5px}
.nota{font-size:11.5px;color:var(--texto-3);padding:10px 16px 14px;line-height:1.6;margin:0}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:var(--painel);border-top:1px solid var(--borda);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;
  gap:4px;color:var(--texto-3);font-size:10.5px;font-weight:600}
nav button.ativo{color:var(--vermelho)}
nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="topo">
  <div class="logo">DM<span>BANDEIRANTES</span></div>
  <h1 id="tituloTela">Acompanhamento</h1>
  <div class="quando" id="carimbo">carregando</div>
  <button class="recarrega" id="btTema" onclick="virarTema()" title="Alternar tema">
    <svg id="iconeTema" viewBox="0 0 24 24"></svg>
  </button>
  <button class="recarrega" onclick="carregar()" title="Atualizar">
    <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>
  </button>
</div>

<div class="filtros" id="barraFiltros">
  <div class="campo">
    <label>Desenvolvedor</label>
    <select id="seletor" onchange="trocar(this.value)"></select>
  </div>
  <div class="tag-fonte" id="fonteVendas"></div>
</div>

<main id="conteudo">
  <div class="painel"><div class="vazio"><b>Carregando</b>Buscando os registros na planilha.</div></div>
</main>

<nav>
  <button id="nav-resumo" class="ativo" onclick="verAba('resumo')">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
    Resumo
  </button>
  <button id="nav-vendas" onclick="verAba('vendas')">
    <svg viewBox="0 0 24 24"><path d="M4 19V5m16 14H4"/><path d="M8 15l3.5-4 3 2.5L20 7"/></svg>
    Vendas
  </button>
  <button id="nav-equipe" onclick="verAba('equipe')">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 19a6 6 0 0 1 12 0"/><path d="M16 6.2a3 3 0 0 1 0 5.6M17.5 19a5.6 5.6 0 0 0-1.7-4"/></svg>
    Equipe
  </button>
  <button id="nav-rota" onclick="verAba('rota')">
    <svg viewBox="0 0 24 24"><path d="M12 21s6.5-5.4 6.5-10.2A6.5 6.5 0 0 0 5.5 10.8C5.5 15.6 12 21 12 21z"/><circle cx="12" cy="10.6" r="2.3"/></svg>
    Roteiro
  </button>
</nav>

<script>
/* ============================================================
   ACOMPANHAMENTO DM — lê o que o app grava na planilha e cruza
   com o faturamento do SAC. Só leitura: nada é gravado aqui.
   ============================================================ */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbwM_abzacGVnsNy9XnSz_8552hplS9G3m77fake4dVQOFW7pQLmDqg7LakKra_VMhuoWg/exec";
const CHAVE = "painel_dm_set2026";

const NOME = {DIG:"Digitalização", GDM1:"1ª geladeira", GDM2:"2ª geladeira",
              STILL:"Still", SSD:"SSD"};
const EXPLICA = {DIG:"cadastro no app com a primeira compra",
                 GDM1:"primeira geladeira do ponto", GDM2:"geladeira adicional",
                 STILL:"linha Still, exceto água", SSD:"KUAT, Sprite e Fanta zero"};

let dados=null, eu="", aba="resumo", tema="escuro";
try{ eu=localStorage.getItem(CHAVE)||""; }catch(e){}
/* Tema: respeita a escolha guardada; na primeira vez segue o sistema. */
try{
  const salvo=localStorage.getItem(CHAVE+"_tema");
  if(salvo) tema=salvo;
  else if(window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) tema="claro";
}catch(e){}
const LUA='<path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/>';
const SOL='<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
function aplicarTema(){
  document.documentElement.setAttribute("data-tema",tema);
  const ic=document.getElementById("iconeTema");
  if(ic) ic.innerHTML = tema==="escuro" ? SOL : LUA;
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", tema==="escuro" ? "#0E1015" : "#FFFFFF");
  const b=document.getElementById("btTema");
  if(b) b.title = tema==="escuro" ? "Mudar para o tema claro" : "Mudar para o tema escuro";
}
function virarTema(){
  tema = tema==="escuro" ? "claro" : "escuro";
  try{ localStorage.setItem(CHAVE+"_tema",tema); }catch(e){}
  aplicarTema();
}

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,
  m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const pc=v=>Math.round((v||0)*100);
const meu=()=>dados?dados.devs.filter(x=>x.dev===eu)[0]:null;

function carregar(){
  document.getElementById("carimbo").textContent="atualizando";
  if(ENDPOINT.indexOf("http")!==0){
    falhou("Endereço não configurado","Cole a URL do Apps Script na constante ENDPOINT."); return;}
  const url=ENDPOINT+"?acao=painel&_="+Date.now();
  if(typeof fetch!=="function"){ jsonp(url); return; }
  fetch(url).then(r=>r.json()).then(usar).catch(()=>jsonp(url));
}
/* alguns navegadores bloqueiam a leitura direta; nesse caso pedimos por script */
function jsonp(url){
  const fn="cb"+Date.now();
  window[fn]=d=>{delete window[fn];s.remove();usar(d);};
  const s=document.createElement("script");
  s.src=url+"&callback="+fn;
  s.onerror=()=>{s.remove();falhou("Não deu para buscar os números","Confira a conexão e atualize.");};
  document.body.appendChild(s);
}
function usar(d){
  if(!d||!d.ok){falhou("A planilha respondeu com erro",(d&&d.erro)||"Tente novamente.");return;}
  dados=d;
  document.getElementById("carimbo").innerHTML="registros até<br><b>"+esc(d.atualizado)+"</b>";
  const s=document.getElementById("seletor");
  s.innerHTML=d.devs.slice().sort((a,b)=>a.dev.localeCompare(b.dev))
    .map(x=>'<option value="'+esc(x.dev)+'">'+esc(x.dev)+"</option>").join("");
  if(!eu||!d.devs.some(x=>x.dev===eu)) eu=s.options[0].value;
  s.value=eu;
  document.getElementById("fonteVendas").innerHTML = d.temVendas
    ? '<span class="ponto"></span>SAC: '+d.linhasVendas+" clientes"
    : '<span class="ponto frio"></span>SAC ainda não colado';
  desenhar();
}
function falhou(t,p){
  document.getElementById("carimbo").textContent="sem dados";
  document.getElementById("conteudo").innerHTML=
    '<div class="painel"><div class="vazio"><b>'+esc(t)+"</b>"+esc(p)+"</div></div>";
}
function trocar(v){eu=v;try{localStorage.setItem(CHAVE,v);}catch(e){}desenhar();}
function verAba(a){
  aba=a;
  ["resumo","vendas","equipe","rota"].forEach(k=>
    document.getElementById("nav-"+k).classList.toggle("ativo",k===a));
  desenhar(); window.scrollTo(0,0);
}
function desenhar(){
  if(!dados)return;
  const d=meu();
  document.getElementById("tituloTela").textContent=
    ({resumo:"Acompanhamento",vendas:"Registrado x faturado",equipe:"Equipe",rota:"Roteiro"})[aba];
  document.getElementById("barraFiltros").classList.toggle("oculto",aba==="equipe");
  document.getElementById("conteudo").innerHTML=
    aba==="resumo"?telaResumo(d):aba==="vendas"?telaVendas(d):
    aba==="equipe"?telaEquipe():telaRota(d);
}
function prog(v,alvo){
  const p=alvo?Math.min(100,v/alvo*100):0;
  const cls=v>=alvo?"ok":(p<50?"baixo":"");
  return '<div class="prog"><i class="'+cls+'" style="width:'+p+'%"></i></div>';
}
function semDev(){
  return '<div class="painel"><div class="vazio"><b>Escolha o desenvolvedor</b>Use o filtro acima.</div></div>';
}

/* ---------- resumo ---------- */
function telaResumo(d){
  if(!d)return semDev();
  const falta=Math.max(0,d.metaVisita-d.visitas);
  let h='<div class="faixa">'+
    '<div class="kpi destaque"><div class="rot">Registros hoje</div><div class="val">'+d.hoje+
      '</div><div class="pe">'+d.registros+" no mês</div></div>"+
    '<div class="kpi'+(d.gatilho?" ok":"")+'"><div class="rot">Visita da base</div><div class="val">'+
      pc(d.pcVisita)+'%</div><div class="pe">'+d.visitas+" de "+d.metaVisita+"</div></div>"+
    '<div class="kpi"><div class="rot">Atendimentos</div><div class="val">'+d.efetivas+
      '</div><div class="pe">'+(d.base-d.registros)+" a visitar</div></div>"+
    '<div class="kpi"><div class="rot">Aderência ao roteiro</div><div class="val">'+pc(d.aderencia)+
      '%</div><div class="pe">referência 90%</div></div></div>';

  h+='<div class="painel"><h2>Gatilho de visita <small>'+
    (d.gatilho?'<span class="selo ok">liberado</span>':'<span class="selo esperando">faltam '+falta+'</span>')+
    '</small></h2><div class="corpo">'+
    '<div class="metaTopo"><b>80% da base</b><span class="n">'+d.visitas+" <i>/ "+d.metaVisita+"</i></span></div>"+
    prog(d.visitas,d.metaVisita)+
    '<div class="metaPe"><span>'+(d.gatilho?"as metas de conversão já contam"
      :"as metas de conversão só valem depois do gatilho")+"</span><span>base "+d.baseAjustada+"</span></div>"+
    "</div></div>";

  h+='<div class="painel"><h2>Metas do mês <small>régua individual</small></h2><div class="corpo">';
  Object.keys(d.pilares).forEach(function(p){
    const x=d.pilares[p], f=Math.max(0,x.meta-x.conv);
    h+='<div class="metaLinha"><div class="metaTopo"><b>'+esc(NOME[p]||p)+
      '</b><span class="n">'+x.conv+" <i>/ "+x.meta+"</i></span></div>"+prog(x.conv,x.meta)+
      '<div class="metaPe"><span>'+esc(EXPLICA[p]||"")+"</span><span>"+
      (f?f+" para a meta":"meta batida")+" · "+x.oport+" oportunidades</span></div></div>";
  });
  h+="</div></div>";

  if(d.fora||d.verificar||d.semGps){
    h+='<div class="painel"><h2>Pontos de atenção</h2><div class="rolagem"><table>';
    if(d.fora) h+='<tr><td class="nome">Fora da base</td><td>'+d.fora+
      ' ponto(s) fechados em definitivo ou não localizados</td><td class="n"><span class="selo neutro">base '+
      d.baseAjustada+"</span></td></tr>";
    if(d.verificar) h+='<tr><td class="nome">Longe do PDV</td><td>'+d.verificar+
      ' registro(s) fora do raio</td><td class="n"><span class="selo alerta">conferir</span></td></tr>';
    if(d.semGps) h+='<tr><td class="nome">Sem localização</td><td>'+d.semGps+
      ' registro(s) sem GPS</td><td class="n"><span class="selo esperando">ligar GPS</span></td></tr>';
    h+="</table></div></div>";
  }
  return h;
}

/* ---------- vendas ---------- */
function telaVendas(d){
  if(!d)return semDev();
  if(!dados.temVendas){
    return '<div class="painel"><h2>Faturamento</h2><div class="vazio">'+
      "<b>O SAC ainda não foi carregado</b>"+
      "Cole o export do SAC na aba Analytics (Vendas) da planilha. Assim que colar, esta tela "+
      "compara o que foi registrado no app com o que foi faturado.</div></div>";
  }
  const v=d.vendas||{digital:0,still:0,ssd:0,declarados:0,confirmados:0,pendentes:[]};
  const dig=d.pilares.DIG?d.pilares.DIG.conv:0;
  const taxa=v.declarados?v.confirmados/v.declarados:0;
  let h='<div class="faixa">'+
    '<div class="kpi"><div class="rot">Registrado no app</div><div class="val">'+dig+
      '</div><div class="pe">digitalização</div></div>'+
    '<div class="kpi ok"><div class="rot">Faturado no SAC</div><div class="val">'+v.digital+
      '</div><div class="pe">compraram pelo app</div></div>'+
    '<div class="kpi'+(dig-v.digital>0?" destaque":"")+'"><div class="rot">Diferença</div><div class="val">'+
      (dig-v.digital)+'</div><div class="pe">registrado sem faturar</div></div>'+
    '<div class="kpi"><div class="rot">Confirmação</div><div class="val">'+pc(taxa)+
      '%</div><div class="pe">do que você declarou</div></div></div>';

  h+='<div class="painel"><h2>Cobertura por categoria <small>fonte SAC</small></h2><div class="rolagem"><table>'+
    '<tr><th>Categoria</th><th class="n">App</th><th class="n">SAC</th><th class="n">Situação</th></tr>';
  const linhas=[["Digitalização",dig,v.digital]];
  if(d.pilares.STILL) linhas.push(["Still",d.pilares.STILL.conv,v.still]);
  if(d.pilares.SSD) linhas.push(["SSD",d.pilares.SSD.conv,v.ssd]);
  linhas.forEach(function(l){
    const dif=l[1]-l[2];
    h+='<tr><td class="nome">'+esc(l[0])+'</td><td class="n">'+l[1]+'</td><td class="n">'+l[2]+
      '</td><td class="n">'+(dif>0?'<span class="selo esperando">'+dif+" a confirmar</span>"
        :dif<0?'<span class="selo ok">+'+(-dif)+" além</span>":'<span class="selo ok">bate</span>')+
      "</td></tr>";
  });
  h+='</table></div><p class="nota">O SAC considera faturado quem já teve pedido processado. '+
     "Pedido feito hoje pode aparecer só na próxima carga.</p></div>";

  if(v.pendentes&&v.pendentes.length){
    h+='<div class="painel"><h2>Registrados sem faturamento <small>'+v.pendentes.length+
      ' cliente(s)</small></h2><div class="rolagem"><table>'+
      "<tr><th>PV</th><th>Cliente</th><th>Registro</th></tr>";
    v.pendentes.forEach(function(p){
      h+="<tr><td>"+esc(p.pv)+'</td><td class="nome">'+esc(p.cliente)+
        '</td><td class="mini">'+esc(p.data)+"</td></tr>";
    });
    h+='</table></div><p class="nota">Você marcou cadastro com primeira venda, mas o SAC ainda não '+
       "mostra compra pelo app. Vale confirmar se o pedido foi concluído.</p></div>";
  }
  return h;
}

/* ---------- equipe ---------- */
function telaEquipe(){
  const L=dados.devs;
  /* consolidado da equipe: soma o que cada um fez e o que cada um tem de meta */
  const T={hoje:0,reg:0,vis:0,metaVis:0,base:0,liberados:0,verificar:0,semGps:0};
  const P={};
  L.forEach(function(d){
    T.hoje+=d.hoje; T.reg+=d.registros; T.vis+=d.visitas;
    T.metaVis+=d.metaVisita; T.base+=d.baseAjustada;
    if(d.gatilho)T.liberados++;
    T.verificar+=d.verificar; T.semGps+=d.semGps;
    Object.keys(d.pilares).forEach(function(k){
      if(!P[k])P[k]={conv:0,meta:0,oport:0};
      P[k].conv+=d.pilares[k].conv; P[k].meta+=d.pilares[k].meta; P[k].oport+=d.pilares[k].oport;
    });
  });
  const atingMedio=L.length?L.reduce((a,d)=>a+d.indice,0)/L.length:0;
  let h='<div class="faixa">'+
    '<div class="kpi destaque"><div class="rot">Registros hoje</div><div class="val">'+T.hoje+
      '</div><div class="pe">'+T.reg+" no mês</div></div>"+
    '<div class="kpi'+(T.vis>=T.metaVis?" ok":"")+'"><div class="rot">Visita da base</div><div class="val">'+
      (T.base?Math.round(T.vis/T.base*100):0)+'%</div><div class="pe">'+T.vis+" de "+T.metaVis+"</div></div>"+
    '<div class="kpi"><div class="rot">Gatilho liberado</div><div class="val">'+T.liberados+" / "+L.length+
      '</div><div class="pe">desenvolvedores</div></div>'+
    '<div class="kpi"><div class="rot">Atingimento médio</div><div class="val">'+pc(atingMedio)+
      '%</div><div class="pe">das metas do mês</div></div></div>';

  h+='<div class="painel"><h2>Consolidado das metas <small>equipe inteira</small></h2><div class="corpo">';
  ["DIG","GDM1","GDM2","STILL","SSD"].forEach(function(k){
    const x=P[k]; if(!x||!x.meta)return;
    const f=Math.max(0,x.meta-x.conv);
    h+='<div class="metaLinha"><div class="metaTopo"><b>'+esc(NOME[k]||k)+
      '</b><span class="n">'+x.conv+" <i>/ "+x.meta+"</i></span></div>"+prog(x.conv,x.meta)+
      '<div class="metaPe"><span>'+x.oport+" oportunidades na equipe</span><span>"+
      (f?f+" para a meta":"meta batida")+"</span></div></div>";
  });
  h+="</div></div>";

  h+='<div class="painel"><h2>Parcial por visita</h2><div class="rolagem"><table>'+
    '<tr><th>Desenvolvedor</th><th>Rota</th><th class="n">Base</th><th class="n">Registros</th>'+
    '<th class="n">Visitas</th><th class="n">80%</th></tr>';
  L.slice().sort((a,b)=>b.pcVisita-a.pcVisita).forEach(function(d){
    h+="<tr"+(d.dev===eu?' class="eu"':"")+'><td class="nome">'+esc(d.dev)+'</td><td class="mini">'+
      esc(d.rota)+'</td><td class="n">'+d.baseAjustada+'</td><td class="n">'+d.registros+
      '</td><td class="n">'+d.visitas+'</td><td class="n">'+
      '<span class="selo '+(d.gatilho?"ok":"esperando")+'">'+pc(d.pcVisita)+"%</span></td></tr>";
  });
  h+='<tr class="total"><td>Total</td><td></td><td class="n">'+T.base+'</td><td class="n">'+T.reg+
    '</td><td class="n">'+T.vis+'</td><td class="n">'+(T.base?Math.round(T.vis/T.base*100):0)+"%</td></tr>";
  h+="</table></div></div>";

  h+='<div class="painel"><h2>Cobertura por pilar <small>realizado / meta</small></h2><div class="rolagem"><table>'+
    '<tr><th>Desenvolvedor</th><th class="n">Digital</th><th class="n">1ª gel.</th>'+
    '<th class="n">2ª gel.</th><th class="n">Still</th><th class="n">SSD</th><th class="n">Índice</th></tr>';
  L.forEach(function(d){
    const c=p=>d.pilares[p]?d.pilares[p].conv+' <span class="mini">/ '+d.pilares[p].meta+"</span>":"—";
    h+="<tr"+(d.dev===eu?' class="eu"':"")+'><td class="nome">'+esc(d.dev)+'</td><td class="n">'+
      c("DIG")+'</td><td class="n">'+c("GDM1")+'</td><td class="n">'+c("GDM2")+'</td><td class="n">'+
      c("STILL")+'</td><td class="n">'+c("SSD")+'</td><td class="n"><b>'+pc(d.indice)+"%</b></td></tr>";
  });
  const ct=k=>P[k]&&P[k].meta?P[k].conv+' <span class="mini">/ '+P[k].meta+"</span>":"—";
  h+='<tr class="total"><td>Total</td><td class="n">'+ct("DIG")+'</td><td class="n">'+ct("GDM1")+
    '</td><td class="n">'+ct("GDM2")+'</td><td class="n">'+ct("STILL")+'</td><td class="n">'+
    ct("SSD")+'</td><td class="n">'+pc(atingMedio)+"%</td></tr>";
  h+="</table></div></div>";

  if(dados.temVendas){
    h+='<div class="painel"><h2>Registrado x faturado <small>fonte SAC</small></h2><div class="rolagem"><table>'+
      '<tr><th>Desenvolvedor</th><th class="n">App</th><th class="n">SAC</th>'+
      '<th class="n">Dif.</th><th class="n">Confirmação</th></tr>';
    L.forEach(function(d){
      const v=d.vendas; if(!v)return;
      const app=d.pilares.DIG?d.pilares.DIG.conv:0, dif=app-v.digital;
      const t=v.declarados?v.confirmados/v.declarados:0;
      h+="<tr"+(d.dev===eu?' class="eu"':"")+'><td class="nome">'+esc(d.dev)+'</td><td class="n">'+
        app+'</td><td class="n">'+v.digital+'</td><td class="n">'+
        (dif>0?'<span class="selo esperando">'+dif+"</span>":'<span class="selo ok">0</span>')+
        '</td><td class="n">'+pc(t)+"%</td></tr>";
    });
    h+="</table></div></div>";
  }
  if(T.verificar||T.semGps){
    h+='<div class="painel"><h2>Conferência de localização</h2><div class="rolagem"><table>'+
      '<tr><td class="nome">Fora do raio do PDV</td><td class="n">'+T.verificar+"</td></tr>"+
      '<tr><td class="nome">Sem GPS capturado</td><td class="n">'+T.semGps+"</td></tr>"+
      "</table></div></div>";
  }
  return h;
}

/* ---------- roteiro ---------- */
function telaRota(d){
  if(!d)return semDev();
  const dias=Object.keys(d.planDia).map(Number).sort((a,b)=>a-b);
  const rodados=dias.filter(n=>d.porDia[n]);
  const ultimo=rodados.length?Math.max.apply(null,rodados):1;
  let h='<div class="faixa">'+
    '<div class="kpi'+(d.aderencia>=.9?" ok":"")+'"><div class="rot">Aderência acumulada</div><div class="val">'+
      pc(d.aderencia)+'%</div><div class="pe">referência 90%</div></div>'+
    '<div class="kpi"><div class="rot">Dias rodados</div><div class="val">'+rodados.length+
      '</div><div class="pe">de '+dias.length+" no mês</div></div></div>";
  h+='<div class="painel"><h2>Planejado x executado</h2><div class="rolagem"><table>'+
    '<tr><th>Dia</th><th class="n">Planejado</th><th class="n">Executado</th>'+
    '<th class="n">Não exec.</th><th class="n">Aderência</th></tr>';
  let tp=0,tf=0;
  dias.forEach(function(n){
    if(n>ultimo)return;
    const p=d.planDia[n]||0, f=d.porDia[n]||0;
    tp+=p; tf+=f;
    const a=p?f/p:0;
    h+='<tr><td class="nome">Dia '+n+'</td><td class="n">'+p+'</td><td class="n">'+f+
      '</td><td class="n">'+Math.max(0,p-f)+'</td><td class="n"><span class="selo '+
      (a>=.9?"ok":a>=.6?"esperando":"alerta")+'">'+pc(a)+"%</span></td></tr>";
  });
  h+='<tr class="total"><td>Total</td><td class="n">'+tp+'</td><td class="n">'+tf+
    '</td><td class="n">'+Math.max(0,tp-tf)+'</td><td class="n">'+(tp?pc(tf/tp):0)+"%</td></tr>";
  h+="</table></div></div>";
  return h;
}

aplicarTema();
carregar();
setInterval(carregar,5*60*1000);
