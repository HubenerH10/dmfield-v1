    const iso=d.getUTCFullYear()+"-"+("0"+(d.getUTCMonth()+1)).slice(-2)+"-"+("0"+d.getUTCDate()).slice(-2);
    if(w>=1&&w<=5&&FERIADOS.indexOf(iso)<0)out.push(new Date(d.getTime()));

  }

})();

function agora(){
  const p={};
  try{new Intl.DateTimeFormat("pt-BR",{timeZone:"America/Sao_Paulo",year:"numeric",month:"2-digit",
    day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})
    .formatToParts(new Date()).forEach(x=>p[x.type]=x.value);}
  catch(e){const d=new Date(Date.now()-108e5);
    p.day=pad(d.getUTCDate());p.month=pad(d.getUTCMonth()+1);p.year=d.getUTCFullYear();
    p.hour=pad(d.getUTCHours());p.minute=pad(d.getUTCMinutes());p.second=pad(d.getUTCSeconds());}
  if(p.hour==="24")p.hour="00";
  const data=p.day+"/"+p.month+"/"+p.year, hora=p.hour+":"+p.minute+":"+p.second;
  const nd=new Date(p.year+"-"+p.month+"-"+p.day+"T12:00:00Z");
  return {data:data,hora:hora,hm:p.hour+":"+p.minute,ts:data+" "+hora,
    iso:p.year+"-"+p.month+"-"+p.day+"T"+hora+"-03:00",
    dow:["Dom","Seg","Ter","Qua","Qui","Sex","Sab"][nd.getUTCDay()]};
}

/* ---------------- lista ---------------- */
function filtrar(ov){
  ov=ov||{};
  const fD=ov.dia!==undefined?ov.dia:fDia;
  const fP=ov.pil!==undefined?ov.pil:fPil;
  const fS=ov.st !==undefined?ov.st :fSt;
  const q=busca.trim().toLowerCase(), R=reg(), hj=diaDeHoje();
  return baseAtual().filter(c=>{
    const v=R[c.id];
    if(fS==="pend"&&v)return false;
    if(fS==="feito"&&!v)return false;
    if(fS==="conv"&&!feito(c))return false;
    if(fS==="revisitar"&&(!v||REVISITAR.indexOf(v.status)<0))return false;
    if(fD==="hoje"){ if(!hj||c.dia!==hj)return false; }
    else if(fD!=="todos"&&c.dia!==+fD)return false;
    if(fP!=="todos"&&c.pil.indexOf(fP)<0)return false;
    if(q&&(c.nome+" "+c.id+" "+c.bairro+" "+c.end+" "+c.cidade+" "+c.seg).toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort((a,b)=>a.dia-b.dia||a.seq-b.seq);
}
function vLista(){
  const b=baseAtual(), R=reg(), hj=diaDeHoje();
  let h='<div class="bar"><b>Base: <em>'+esc(rotaCod())+'</em></b>'+
    '<button class="mini" onclick="tela(\'onb\')">← Trocar</button></div>'+
    '<input class="search" placeholder="Buscar por nome, PV, bairro..." value="'+esc(busca)+
    '" oninput="busca=this.value;lista()">';
  const nD=v=>filtrar({dia:v}).length, nP=v=>filtrar({pil:v}).length, nS=v=>filtrar({st:v}).length;
  let cd = hj ? chip("hoje","⭐ Hoje · dia "+hj,fDia,"setDia",nD("hoje")) : "";
  cd += chip("todos","Todos",fDia,"setDia",nD("todos"));
  for(let d=1;d<=DIAS_UTEIS.length;d++){
    if(d===hj)continue;
    const n=b.filter(c=>c.dia===d).length; if(!n)continue;
    cd+=chip(String(d),"Dia "+d+" · "+dataDoDia(d),fDia,"setDia",nD(String(d)));
  }
  h+='<div class="chips" id="cd">'+cd+"</div>";
  h+='<div class="chips">'+chip("todos","Todos",fPil,"setPil",nP("todos"))+pilChips(b,nP)+"</div>";
  h+='<div class="chips">'+chip("pend","Pendentes",fSt,"setSt",nS("pend"))+
     chip("feito","Registrados",fSt,"setSt",nS("feito"))+
     chip("revisitar","Revisitar",fSt,"setSt",nS("revisitar"))+
     chip("conv","Convertidos",fSt,"setSt",nS("conv"))+
     chip("todos","Todos",fSt,"setSt",nS("todos"))+"</div>";
  h+='<div id="lst"></div>';
  setTimeout(lista,0);
  return h;
}
function chip(v,t,at,fn,n){return '<button class="chip'+(at===v?" on":"")+'" onclick="'+fn+'(\''+v+'\')">'+
  esc(t)+(n!=null?'<small>'+n+"</small>":"")+"</button>";}
function pilChips(b,nP){
  const vistos=[]; b.forEach(c=>c.pil.forEach(p=>{if(vistos.indexOf(p)<0)vistos.push(p);}));
  vistos.sort((a,b2)=>ORDEM_PIL.indexOf(a)-ORDEM_PIL.indexOf(b2));
  return vistos.map(p=>chip(p,PILAR[p].n,fPil,"setPil",nP(p))).join("");
}
function setDia(v){fDia=v;render();}
function setPil(v){fPil=v;render();}
function setSt(v){fSt=v;render();}
function lista(){
  const l=filtrar(), e=document.getElementById("lst"); if(!e)return;

  if(fDia==="hoje"&&!hj) cab='<div class="vaz"><b>Hoje não é dia de rota</b>'+

    (l.length?l.map(card).join(""):(cab||'<div class="vaz"><b>Nada por aqui</b>Tente outro dia ou limpe a busca.</div>'));

function card(c){

function resumo(c,v){

        return opt(o[0],marcado,o[1]==="p"?"p":(o[1]==="n"?"n":""),"setResp('"+p+"',"+i+")");
      }).join(""));
      if(P.modelo&&(tmp.resp[p]==="Geladeira instalada"||tmp.resp[p]==="Negociada, aguardando instalação")){
        h+='<div class="grupo"><div class="gl">Modelo da geladeira</div>'+

     '<button class="cta o" onclick="tela(\'lista\')">← Voltar</button>';

function grupo(t,inner){return '<div class="grupo"><div class="gl">'+t+'</div><div class="opts">'+inner+"</div></div>";}
function opt(t,on,k,fn){return '<button class="opt'+(on?" on "+k:"")+'" onclick="'+fn+'"><span class="d"></span>'+esc(t)+"</button>";}
function setStatus(i){tmp.status=STATUS[i].t;if(!EFET[tmp.status]){tmp.resp={};tmp.modelo="";}render();}
function setResp(p,i){
  const P=PILAR[p], v=P.o[i][0];
  if(!P.multi){
    tmp.resp[p]=v;
    if(P.modelo&&v!=="Geladeira instalada"&&v!=="Negociada, aguardando instalação")tmp.modelo="";
    render(); return;
  }
  let lista=Array.isArray(tmp.resp[p])?tmp.resp[p].slice():[];
  if(v==="Não vendeu"){ lista=lista.indexOf(v)>=0?[]:["Não vendeu"]; }
  else{
    lista=lista.filter(x=>x!=="Não vendeu");
    const k=lista.indexOf(v);
    if(k>=0)lista.splice(k,1); else lista.push(v);
  }
  tmp.resp[p]=lista; render();
}
function salvar(){
  if(!tmp.status){toast("Marque a situação da visita");return;}
  if(EFET[tmp.status]){
    const f=cur.pil.filter(p=>{const r=tmp.resp[p];return PILAR[p].multi?!(Array.isArray(r)&&r.length):!r;});
    if(f.length){toast("Responda: "+f.map(p=>PILAR[p].n).join(", "));return;}
  }
  const t=agora();
  tmp.data=t.data;tmp.hora=t.hora;tmp.hm=t.hm;tmp.ts=t.ts;tmp.iso=t.iso;tmp.dow=t.dow;tmp.sent=false;
  const fim=()=>{reg()[cur.id]=tmp;save();ultimo=cur.id;tela("ok");if(navigator.onLine)sinc(true);};
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(p=>{
      tmp.gps={lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy||0)};
      tmp.dist=hav(cur.lat,cur.lon,tmp.gps.lat,tmp.gps.lon);fim();},
      e=>{tmp.gps=null;tmp.dist=null;tmp.gpsErro=(e&&e.code===1)?"Permissão negada":"Sinal indisponível";fim();},
      {enableHighAccuracy:true,timeout:10000,maximumAge:0});
  }else{tmp.gps=null;tmp.dist=null;tmp.gpsErro="Aparelho sem GPS";fim();}
}

function msg(id){
  const c=baseAtual().filter(x=>x.id===id)[0], v=reg()[id];
  if(!c||!v)return "";
  const L2=[];
  L2.push("🏪 "+c.nome+" | PV "+c.id);
  L2.push("📍 "+String(c.seg).toUpperCase()+" | GC. "+c.gc+" | Rota: "+rotaCod());
  L2.push("");
  L2.push("✅ "+v.status);
  if(EFET[v.status]) c.pil.forEach(p=>L2.push("• "+PILAR[p].n+": "+textoResp(p,(v.resp||{})[p])));
  if(v.modelo)L2.push("• Modelo: "+v.modelo);
  if(v.motivo)L2.push("• Motivo: "+v.motivo);
  if(v.obs)L2.push("📝 "+v.obs);
  L2.push(v.dist!=null?("📌 "+v.dist+" m do PDV cadastrado"):"📌 Localização não capturada");

  L2.push("Enviado via "+MARCA+" 🔴");
  return L2.join("\n");

function zap(id){

/* ---------------- parciais ---------------- */
function met(){
  const b=baseAtual(), R=reg();
  const rg=b.filter(c=>R[c.id]);
  const vs=rg.filter(c=>contaVisita(R[c.id]));       // conta no gatilho de 80%
  const efet=rg.filter(c=>EFET[R[c.id].status]);     // conseguiu atender
  const fora=rg.filter(c=>foraDaBase(R[c.id]));      // sai do denominador
  const baseAj=b.length-fora.length;
  const porStatus={}; rg.forEach(c=>{const s=R[c.id].status;porStatus[s]=(porStatus[s]||0)+1;});
  const pil={};
  ORDEM_PIL.forEach(p=>{
    const m=metaDe(S.dev,p); if(!m)return;
    let conv=0, disp=0;
    b.forEach(c=>{
      if(c.pil.indexOf(p)<0)return;
      if(!foraDaBase(R[c.id]))disp++;
      const v=R[c.id]; if(v)conv+=qtdPositiva(p,(v.resp||{})[p]);
    });
    pil[p]={base:disp,oport:m.oport,alvo:m.qtd,pc:m.pc,conv:conv};
  });
  return {base:b.length,baseAj:baseAj,reg:rg.length,vis:vs.length,efet:efet.length,
    fora:fora.length,porStatus:porStatus,pil:pil,
    alvoVis:Math.min(metaVisita(S.dev),Math.round(baseAj*MIN_VIS))};
}
function barra(rot,val,tot,alvo,pc,leg){

    ' <span style="opacity:.5">de '+tot+'</span></b></div><div class="track"><div class="fill'+(ok?" ok":"")+
    '" style="width:'+Math.min(100,p)+'%"></div><div class="gate" style="left:'+Math.min(100,g)+'%"></div></div>'+
    '<div class="lg">Meta '+Math.round(g)+"% = "+alvo+(ok?" · atingida":" · faltam "+(alvo-val))+
    (leg?" · "+esc(leg):"")+"</div></div>";
}

  ORDEM_PIL.forEach(p=>{const x=m.pil[p]; if(!x)return;
    h+=barra(PILAR[p].n,x.conv,x.oport,x.alvo,x.pc,PILAR[p].d);});
  h+='<p class="note">A régua de cada pilar é a definida para você na planilha de setembro.</p></div>';
  const segs={};
  baseAtual().forEach(c=>{const k=c.seg;if(!segs[k])segs[k]=[0,0];segs[k][1]++;
    if(S.vis[c.id]&&EFET[S.vis[c.id].status])segs[k][0]++;});
  h+='<div class="blk"><h3>Por segmento</h3>'+Object.keys(segs).sort((a,b)=>segs[b][1]-segs[a][1])
    .map(k=>'<div class="row"><span class="a">'+esc(k)+'</span><span class="b2">'+segs[k][0]+"/"+segs[k][1]+
    '</span><span class="c2">'+Math.round(segs[k][0]/segs[k][1]*100)+"%</span></div>").join("")+"</div>";
  const pend=registros().filter(r=>!r._sent).length;
  h+='<div class="blk"><h3>Enviar para o Sheets</h3>'+
    '<button class="cta" style="margin-top:0" onclick="sinc(false)">Sincronizar agora</button>'+
    '<p class="lg">'+(pend?pend+" registro(s) aguardando envio.":"Tudo sincronizado.")+"</p>"+
    '<button class="cta o" onclick="buscarSac(false)">Atualizar faturamento</button>'+
    '<button class="cta o" onclick="csv()">⬇ Baixar CSV</button>'+
    '<p class="lg">Horário sempre em Brasília (UTC−3), independente do relógio do celular.</p></div>';
  return h;
}

/* ---------------- registros, CSV, sync ---------------- */
const COLS=["pv","cliente","desenvolvedor","assinatura","rota","dia_roteiro","data_roteiro","seq_visita",
  "data","hora","data_hora","dia_semana","dia_pedido","oportunidade","segmento","gc","status",
  "digital","gdm1","gdm2","still","ssd","ssd_qtd","modelo_geladeira","motivo","observacao",
  "bairro","cidade","lat_cadastro","lon_cadastro","lat_visita","lon_visita","precisao_m",
  "distancia_m","raio_aceito_m","verificar"];
function registros(){
  const out=[];
  ROTA.forEach(c=>{
    const v=S.vis[c.id]; if(!v)return; const r=v.resp||{};
    out.push({pv:c.id,cliente:c.nome,desenvolvedor:c.dev,assinatura:S.nome,rota:RAW.rotaCod[c.dev]||"",
      dia_roteiro:c.dia,data_roteiro:dataDoDia(c.dia),seq_visita:c.seq,
      data:v.data||"",hora:v.hora||"",data_hora:v.ts||"",dia_semana:v.dow||"",dia_pedido:c.diaTxt,
      oportunidade:c.oport,segmento:c.seg,gc:c.gc,status:v.status||"",
      digital:r.DIG||"",gdm1:r.GDM1||"",gdm2:r.GDM2||"",still:r.STILL||"",
      ssd:textoResp("SSD",r.SSD).replace("—",""),ssd_qtd:qtdPositiva("SSD",r.SSD),
      modelo_geladeira:v.modelo||"",motivo:v.motivo||"",observacao:v.obs||"",
      bairro:c.bairro,cidade:c.cidade,lat_cadastro:c.lat,lon_cadastro:c.lon,
      lat_visita:v.gps?v.gps.lat:"",lon_visita:v.gps?v.gps.lon:"",precisao_m:v.gps?v.gps.acc:"",
      distancia_m:(v.dist!=null?v.dist:""),raio_aceito_m:(v.gps?raioAceito(v.gps.acc):""),
      verificar:verif(v),_sent:!!v.sent});
  });
  return out;
}
function csv(){
  const rs=registros(); if(!rs.length){toast("Nada registrado ainda");return;}
  const l=[COLS.join(";")].concat(rs.map(r=>COLS.map(c=>'"'+String(r[c]==null?"":r[c]).replace(/"/g,'""')+'"').join(";")));
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\ufeff"+l.join("\r\n")],{type:"text/csv;charset=utf-8"}));
  a.download="dmfield_set_"+String(S.dev).replace(/\W/g,"")+"_"+agora().data.replace(/\//g,"")+".csv";
  document.body.appendChild(a);a.click();a.remove();
}
function sinc(sil){
  if(!SYNC_URL||SYNC_URL.indexOf("http")!==0){if(!sil)toast("Configure a URL do Apps Script");return;}
  if(typeof fetch!=="function"){if(!sil)toast("Navegador sem suporte a envio");return;}
  const pend=registros().filter(r=>!r._sent);
  if(!pend.length){if(!sil)toast("Nada novo para enviar");return;}
  const env=pend.map(p=>{const o=Object.assign({},p);delete o._sent;return o;});
  fetch(SYNC_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({visitas:env})})
  .then(()=>{pend.forEach(p=>{if(S.vis[p.pv])S.vis[p.pv].sent=true;});
    save();if(!sil)toast("Enviado: "+pend.length+" registro(s)");render();})
  .catch(()=>{if(!sil)toast("Sem conexão — tente de novo com sinal");});
}
window.addEventListener("online",()=>{sinc(true);buscarSac(true);});

/* ---------------- retorno do faturamento ----------------
   O mesmo endpoint que alimenta o painel devolve, para a carteira
   do desenvolvedor, quais clientes já apareceram faturados no SAC.
   Fica guardado no aparelho, então continua visível sem sinal. */
function buscarSac(silencioso){
  if(!SYNC_URL||SYNC_URL.indexOf("http")!==0)return;
  if(!S.dev)return;
  if(typeof fetch!=="function")return;
  const url=SYNC_URL+"?acao=painel&dev="+encodeURIComponent(S.dev)+"&_="+Date.now();
  fetch(url).then(r=>r.json()).then(function(d){
    if(!d||!d.ok||!d.devs||!d.devs.length)return;
    const x=d.devs[0];
    S.sac={quando:d.atualizado,tem:!!d.temVendas,
           faturados:(x.vendas&&x.vendas.faturados)||[],
           pendentes:(x.vendas&&x.vendas.pendentes)||[],
           digital:(x.vendas&&x.vendas.digital)||0,
           still:(x.vendas&&x.vendas.still)||0,
           ssd:(x.vendas&&x.vendas.ssd)||0};
    save();
    if(scr==="parciais"||scr==="lista")render();
  }).catch(function(){ if(!silencioso)toast("Não deu para buscar o faturamento"); });
}
function faturado(id){
  return !!(S.sac&&S.sac.faturados&&S.sac.faturados.indexOf(String(id))>=0);
}

/* ---------------- start ---------------- */
scr = S.dev && S.nome ? "lista" : "onb";
render();
if(S.dev && navigator.onLine) buscarSac(true);
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
