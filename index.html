const EFET={}; STATUS.forEach(s=>EFET[s.t]=!!s.e);
/* Situações que pedem uma segunda passada no PDV. */
const REVISITAR=["PDV fechado","Comprador ausente","Recusou atendimento","Não localizado"];
/* O desenvolvedor esteve no PDV: o deslocamento aconteceu, então conta no gatilho
   de visita. Só fica fora da conversão, que mede venda. */
const CONTA_VISITA=["PDV fechado","Comprador ausente","Recusou atendimento"];
/* PDV que não existe mais ou com endereço errado sai do denominador. */
const FORA_DA_BASE=["PDV fechado permanentemente","Não localizado"];
function contaVisita(v){return !!v && (EFET[v.status]||CONTA_VISITA.indexOf(v.status)>=0);}
function foraDaBase(v){return !!v && FORA_DA_BASE.indexOf(v.status)>=0;}
const MOTIVOS=["Já compra de outro fornecedor","Preço","Sem espaço na gôndola","Sem interesse",
  "Estoque alto","Comprador ausente","Cliente inadimplente","Outro"];

/* ---------------- metas ----------------
   Vêm prontas da planilha do mês: cada desenvolvedor tem régua própria por pilar.
   O app não recalcula percentual, só lê o que foi definido. */
const MIN_VIS=0.80;
function metaDe(dev,p){const m=RAW.metas[dev];return (m&&m[p])?m[p]:null;}
function metaVisita(dev){const m=RAW.metas[dev];return m?m.visita:0;}

/* ---------------- base ---------------- */

const ROTA=RAW.rota.map(r=>({id:r[0],nome:r[1],dev:L.dev[r[2]],
  dia:r[3],seq:r[4],oport:L.oport[r[5]],seg:L.seg[r[6]],diaTxt:L.diaPed[r[7]],
  cnpj:r[8],gc:L.gc[r[9]],vend:L.vend[r[10]],vendTel:L.vendTel[r[11]],
  supv:L.supv[r[12]],sup:L.sup[r[13]],supTel:L.supTel[r[14]],
  tel:r[15],end:r[16],compl:r[17],cep:r[18],bairro:L.bairro[r[19]],cidade:L.cidade[r[20]],
  lat:r[21],lon:r[22],pil:r[23]}));
const DEVS=Array.from(new Set(ROTA.map(c=>c.dev))).sort();

/* O DIA da base é o índice do dia útil do mês, de 1 a 22. */
const FERIADOS=["2026-09-07"];   // Independência: não tem rota
const DIAS_UTEIS=(function(){
  const out=[],d=new Date(Date.UTC(RAW.ano,RAW.mesNum-1,1));
  while(d.getUTCMonth()===RAW.mesNum-1){
    const w=d.getUTCDay();
    const iso=d.getUTCFullYear()+"-"+("0"+(d.getUTCMonth()+1)).slice(-2)+"-"+("0"+d.getUTCDate()).slice(-2);
    if(w>=1&&w<=5&&FERIADOS.indexOf(iso)<0)out.push(new Date(d.getTime()));
    d.setUTCDate(d.getUTCDate()+1);
  }
  return out;
})();
function dataDoDia(n){
  const d=DIAS_UTEIS[n-1]; if(!d)return "";
  return ("0"+d.getUTCDate()).slice(-2)+"/"+("0"+(d.getUTCMonth()+1)).slice(-2);
}
function diaDeHoje(){
  const p=agora().data.split("/"), alvo=p[2]+"-"+p[1]+"-"+p[0];
  for(let i=0;i<DIAS_UTEIS.length;i++){
    const d=DIAS_UTEIS[i];
    const iso=d.getUTCFullYear()+"-"+("0"+(d.getUTCMonth()+1)).slice(-2)+"-"+("0"+d.getUTCDate()).slice(-2);
    if(iso===alvo)return i+1;
  }
  return 0;   // fim de semana ou fora do mês
}

/* ---------------- estado ---------------- */
let S={nome:"",dev:"",vis:{},sac:null};   // sac = último retorno de faturamento

function save(){try{localStorage.setItem(CHAVE,JSON.stringify(S));}catch(e){toast("Sem espaço no aparelho");}}
function reg(){return S.vis;}

/* ---------------- horário de Brasília ---------------- */
function agora(){
  const p={};
  try{new Intl.DateTimeFormat("pt-BR",{timeZone:"America/Sao_Paulo",year:"numeric",month:"2-digit",
    day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})
    .formatToParts(new Date()).forEach(x=>p[x.type]=x.value);}
  catch(e){const d=new Date(Date.now()-108e5);
    p.day=pad(d.getUTCDate());p.month=pad(d.getUTCMonth()+1);p.year=d.getUTCFullYear();
    p.hour=pad(d.getUTCHours());p.minute=pad(d.getUTCMinutes());p.second=pad(d.getUTCSeconds());}
  if(p.hour==="24")p.hour="00";
  const data=p.day+"/"+p.month+"/"+p.year, hora=p.hour+":"+p.minute+":"+p.second;
  const nd=new Date(p.year+"-"+p.month+"-"+p.day+"T12:00:00Z");
  return {data:data,hora:hora,hm:p.hour+":"+p.minute,ts:data+" "+hora,
    iso:p.year+"-"+p.month+"-"+p.day+"T"+hora+"-03:00",
    dow:["Dom","Seg","Ter","Qua","Qui","Sex","Sab"][nd.getUTCDay()]};
}
function pad(n){return (n<10?"0":"")+n;}

/* ---------------- utilidades ---------------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,
  m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function tel1(t){const m=String(t||"").split("/")[0].replace(/\D/g,"");return m.length>=10?m:"";}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");
  clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove("on"),2300);}
function hav(a,b,c,d){const R=6371e3,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;
  const h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(h)));}
function baseAtual(){return ROTA.filter(c=>c.dev===S.dev);}
function positivo(p,r){
  if(PILAR[p].multi) return Array.isArray(r)&&r.length>0&&r.indexOf("Não vendeu")<0;
  return r===PILAR[p].c;
}
function qtdPositiva(p,r){
  if(!PILAR[p].multi) return positivo(p,r)?1:0;
  return Array.isArray(r)?r.filter(x=>x!=="Não vendeu").length:0;
}
function textoResp(p,r){ if(Array.isArray(r))return r.length?r.join(" + "):"—"; return r||"—"; }
function feito(c){const v=reg()[c.id];
  return !!v&&EFET[v.status]&&c.pil.some(p=>positivo(p,(v.resp||{})[p]));}
function presencial(){return true;}
function divergente(v){return !!(v&&v.gps&&v.dist!=null&&v.dist>raioAceito(v.gps.acc));}
function verif(v){ if(v.gps==null)return "SEM GPS"; return divergente(v)?"SIM":""; }
function rotaCod(){return RAW.rotaCod[S.dev]||"";}
function ini(n){return (n||"?").trim().charAt(0).toUpperCase();}

/* ---------------- lista ---------------- */
function filtrar(ov){
  ov=ov||{};
  const fD=ov.dia!==undefined?ov.dia:fDia;
  const fP=ov.pil!==undefined?ov.pil:fPil;
  const fS=ov.st !==undefined?ov.st :fSt;
  const q=busca.trim().toLowerCase(), R=reg(), hj=diaDeHoje();
  return baseAtual().filter(c=>{
    const v=R[c.id];
    if(fS==="pend"&&v)return false;
    if(fS==="feito"&&!v)return false;
    if(fS==="conv"&&!feito(c))return false;
    if(fS==="revisitar"&&(!v||REVISITAR.indexOf(v.status)<0))return false;
    if(fD==="hoje"){ if(!hj||c.dia!==hj)return false; }
    else if(fD!=="todos"&&c.dia!==+fD)return false;
    if(fP!=="todos"&&c.pil.indexOf(fP)<0)return false;
    if(q&&(c.nome+" "+c.id+" "+c.bairro+" "+c.end+" "+c.cidade+" "+c.seg).toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort((a,b)=>a.dia-b.dia||a.seq-b.seq);
}
function vLista(){
  const b=baseAtual(), R=reg(), hj=diaDeHoje();
  let h='<div class="bar"><b>Base: <em>'+esc(rotaCod())+'</em></b>'+
    '<button class="mini" onclick="tela(\'onb\')">← Trocar</button></div>'+
    '<input class="search" placeholder="Buscar por nome, PV, bairro..." value="'+esc(busca)+
    '" oninput="busca=this.value;lista()">';
  const nD=v=>filtrar({dia:v}).length, nP=v=>filtrar({pil:v}).length, nS=v=>filtrar({st:v}).length;
  let cd = hj ? chip("hoje","⭐ Hoje · dia "+hj,fDia,"setDia",nD("hoje")) : "";
  cd += chip("todos","Todos",fDia,"setDia",nD("todos"));
  for(let d=1;d<=DIAS_UTEIS.length;d++){
    if(d===hj)continue;
    const n=b.filter(c=>c.dia===d).length; if(!n)continue;
    cd+=chip(String(d),"Dia "+d+" · "+dataDoDia(d),fDia,"setDia",nD(String(d)));
  }
  h+='<div class="chips" id="cd">'+cd+"</div>";
  h+='<div class="chips">'+chip("todos","Todos",fPil,"setPil",nP("todos"))+pilChips(b,nP)+"</div>";
  h+='<div class="chips">'+chip("pend","Pendentes",fSt,"setSt",nS("pend"))+
     chip("feito","Registrados",fSt,"setSt",nS("feito"))+
     chip("revisitar","Revisitar",fSt,"setSt",nS("revisitar"))+
     chip("conv","Convertidos",fSt,"setSt",nS("conv"))+
     chip("todos","Todos",fSt,"setSt",nS("todos"))+"</div>";
  h+='<div id="lst"></div>';
  setTimeout(lista,0);
  return h;
}
function chip(v,t,at,fn,n){return '<button class="chip'+(at===v?" on":"")+'" onclick="'+fn+'(\''+v+'\')">'+
  esc(t)+(n!=null?'<small>'+n+"</small>":"")+"</button>";}
function pilChips(b,nP){
  const vistos=[]; b.forEach(c=>c.pil.forEach(p=>{if(vistos.indexOf(p)<0)vistos.push(p);}));
  vistos.sort((a,b2)=>ORDEM_PIL.indexOf(a)-ORDEM_PIL.indexOf(b2));
  return vistos.map(p=>chip(p,PILAR[p].n,fPil,"setPil",nP(p))).join("");
}
function setDia(v){fDia=v;render();}
function setPil(v){fPil=v;render();}
function setSt(v){fSt=v;render();}
function lista(){
  const l=filtrar(), e=document.getElementById("lst"); if(!e)return;
  const hj=diaDeHoje();
  let cab="";
  if(fDia==="hoje"&&!hj) cab='<div class="vaz"><b>Hoje não é dia de rota</b>'+
    'Fim de semana ou data fora do mês. Escolha um dia nos filtros acima.</div>';
  e.innerHTML='<p class="count">'+l.length+(l.length===1?" cliente":" clientes")+
    (fDia==="hoje"&&hj?" · roteiro do dia "+hj+" ("+dataDoDia(hj)+")":"")+"</p>"+
    (l.length?l.map(card).join(""):(cab||'<div class="vaz"><b>Nada por aqui</b>Tente outro dia ou limpe a busca.</div>'));
}
function card(c){
  const v=reg()[c.id], ok=feito(c);
  const cls=v?(ok?"ok":(v.status==="PDV fechado permanentemente"?"bx":"na")):"";
  const maps="https://www.google.com/maps/search/?api=1&query="+c.lat+","+c.lon;
  const tags=(faturado(c.id)?'<span class="tg fat">✓ faturado</span>':
      (v&&EFET[v.status]&&positivo("DIG",(v.resp||{}).DIG)&&S.sac&&S.sac.tem
        ?'<span class="tg agu">aguardando faturamento</span>':""))+
    c.pil.map(p=>'<span class="tg pil">'+esc(PILAR[p].n)+"</span>").join("")+
    '<span class="tg dia">Dia '+c.dia+" · "+dataDoDia(c.dia)+" · seq "+c.seq+"</span>"+
    '<span class="tg">'+esc(c.seg)+'</span><span class="tg gc">GC '+esc(c.gc)+"</span>";
  let h='<div class="c '+cls+'"><div class="ch"><div class="av">'+esc(ini(c.nome))+"</div><div>"+
    '<div class="cn">'+esc(c.nome)+'</div><div class="cm">PV '+esc(c.id)+" · "+esc(c.bairro)+" · "+esc(c.cidade)+
    ' <a class="nav" href="'+maps+'" target="_blank" rel="noopener">Navegar</a></div></div></div>'+
    '<div class="tags">'+tags+"</div>";
  if(v)h+=resumo(c,v);
  h+='<div class="acts"><button class="b p" onclick="abrir(\''+c.id+'\')">'+
    (v?"Editar registro":"Registrar visita")+"</button>"+
    (v?'<button class="b s g" onclick="zap(\''+c.id+'\')">WhatsApp</button>':"")+"</div></div>";
  return h;
}
function resumo(c,v){
  if(!EFET[v.status])
    return '<div class="res wa"><b>'+esc(v.status)+"</b>"+(v.motivo?" · "+esc(v.motivo):"")+
      '<span class="q">'+esc(v.data)+" às "+esc(v.hm)+" (Brasília)</span></div>";
  const txt=c.pil.map(p=>"<b>"+esc(PILAR[p].n)+":</b> "+esc(textoResp(p,(v.resp||{})[p]))).join("<br>");
  return '<div class="res '+(feito(c)?"ok":"no")+'">'+txt+
    (v.modelo?"<br><b>Modelo:</b> "+esc(v.modelo):"")+
    (v.motivo?"<br><b>Motivo:</b> "+esc(v.motivo):"")+
    (v.obs?"<br><b>Obs:</b> "+esc(v.obs):"")+
    (v.dist!=null?"<br><b>Distância do PDV:</b> "+v.dist+" m (GPS ±"+(v.gps?v.gps.acc:"?")+" m)"+
      (divergente(v)?" · verificar":""):"<br><b>Localização:</b> não capturada"+(v.gpsErro?" ("+esc(v.gpsErro)+")":""))+
    '<span class="q">'+esc(v.data)+" às "+esc(v.hm)+" (Brasília)"+(v.sent?" · enviado":" · aguardando envio")+"</span></div>";
}

/* ---------------- formulário ---------------- */
function abrir(id){
  cur=baseAtual().filter(c=>c.id===id)[0];
  const v=reg()[id];
  tmp=v?JSON.parse(JSON.stringify(v)):{status:"",resp:{},motivo:"",obs:"",modelo:""};
  if(!tmp.resp)tmp.resp={};
  tela("form");
}
function vForm(){
  const c=cur;
  let h='<h2 class="t">'+esc(c.nome)+'</h2><p class="sub">PV '+esc(c.id)+" · "+esc(c.bairro)+
    " · dia "+c.dia+" ("+dataDoDia(c.dia)+"), seq "+c.seq+"</p>";
  h+=grupo("A visita aconteceu?",STATUS.filter(s=>s.g==="s").map(s=>
      opt(s.t,tmp.status===s.t,"p","setStatus("+STATUS.indexOf(s)+")")).join("")+
    '<div class="gl" style="margin:14px 0 9px">Não foi possível atender</div>'+
    STATUS.filter(s=>s.g==="n").map(s=>opt(s.t,tmp.status===s.t,"n","setStatus("+STATUS.indexOf(s)+")")).join(""));
  if(EFET[tmp.status]){
    c.pil.forEach(p=>{const P=PILAR[p];
      h+=grupo(P.n+' <em>· '+P.d+"</em>",P.o.map((o,i)=>{
        const marcado=P.multi?(Array.isArray(tmp.resp[p])&&tmp.resp[p].indexOf(o[0])>=0):tmp.resp[p]===o[0];
        return opt(o[0],marcado,o[1]==="p"?"p":(o[1]==="n"?"n":""),"setResp('"+p+"',"+i+")");
      }).join(""));
      if(P.modelo&&(tmp.resp[p]==="Geladeira instalada"||tmp.resp[p]==="Negociada, aguardando instalação")){
        h+='<div class="grupo"><div class="gl">Modelo da geladeira</div>'+
          '<select class="sel" onchange="tmp.modelo=this.value"><option value="">Selecione</option>'+
          MODELOS.map(m=>'<option'+(tmp.modelo===m?" selected":"")+">"+esc(m)+"</option>").join("")+"</select></div>";
      }
    });
  }
  const pedeMotivo=tmp.status&&(!EFET[tmp.status]||
    c.pil.some(p=>tmp.resp[p]&&!positivo(p,tmp.resp[p])));
  if(pedeMotivo){
    h+='<div class="grupo"><div class="gl">Motivo</div><select class="sel" onchange="tmp.motivo=this.value">'+
      '<option value="">Selecione</option>'+MOTIVOS.map(m=>'<option'+(tmp.motivo===m?" selected":"")+">"+esc(m)+"</option>").join("")+"</select></div>";
  }
  h+='<div class="grupo"><div class="gl">Observação</div><textarea placeholder="Opcional — o que ficou combinado" oninput="tmp.obs=this.value">'+esc(tmp.obs||"")+"</textarea></div>";
  h+='<div class="gps">Ao salvar, o app grava o horário de Brasília e a sua localização (GPS) para conferir a distância até o PDV. Mantenha a localização ligada.</div>';
  h+='<button class="cta" onclick="salvar()">Enviar validação</button>'+
     '<button class="cta o" onclick="tela(\'lista\')">← Voltar</button>';
  return h;
}
function grupo(t,inner){return '<div class="grupo"><div class="gl">'+t+'</div><div class="opts">'+inner+"</div></div>";}
function opt(t,on,k,fn){return '<button class="opt'+(on?" on "+k:"")+'" onclick="'+fn+'"><span class="d"></span>'+esc(t)+"</button>";}
function setStatus(i){tmp.status=STATUS[i].t;if(!EFET[tmp.status]){tmp.resp={};tmp.modelo="";}render();}
function setResp(p,i){
  const P=PILAR[p], v=P.o[i][0];
  if(!P.multi){
    tmp.resp[p]=v;
    if(P.modelo&&v!=="Geladeira instalada"&&v!=="Negociada, aguardando instalação")tmp.modelo="";
    render(); return;
  }
  let lista=Array.isArray(tmp.resp[p])?tmp.resp[p].slice():[];
  if(v==="Não vendeu"){ lista=lista.indexOf(v)>=0?[]:["Não vendeu"]; }
  else{
    lista=lista.filter(x=>x!=="Não vendeu");
    const k=lista.indexOf(v);
    if(k>=0)lista.splice(k,1); else lista.push(v);
  }
  tmp.resp[p]=lista; render();
}
function salvar(){
  if(!tmp.status){toast("Marque a situação da visita");return;}
  if(EFET[tmp.status]){
    const f=cur.pil.filter(p=>{const r=tmp.resp[p];return PILAR[p].multi?!(Array.isArray(r)&&r.length):!r;});
    if(f.length){toast("Responda: "+f.map(p=>PILAR[p].n).join(", "));return;}
  }
  const t=agora();
  tmp.data=t.data;tmp.hora=t.hora;tmp.hm=t.hm;tmp.ts=t.ts;tmp.iso=t.iso;tmp.dow=t.dow;tmp.sent=false;
  const fim=()=>{reg()[cur.id]=tmp;save();ultimo=cur.id;tela("ok");if(navigator.onLine)sinc(true);};
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(p=>{
      tmp.gps={lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy||0)};
      tmp.dist=hav(cur.lat,cur.lon,tmp.gps.lat,tmp.gps.lon);fim();},
      e=>{tmp.gps=null;tmp.dist=null;tmp.gpsErro=(e&&e.code===1)?"Permissão negada":"Sinal indisponível";fim();},
      {enableHighAccuracy:true,timeout:10000,maximumAge:0});
  }else{tmp.gps=null;tmp.dist=null;tmp.gpsErro="Aparelho sem GPS";fim();}
}

/* ---------------- sucesso ---------------- */
function vOk(){
  const b=baseAtual(),R=reg(),t=agora();
  const c=b.filter(x=>x.id===ultimo)[0]; if(!c){tela("lista");return "";}
  const hoje=b.filter(x=>R[x.id]&&R[x.id].data===t.data).length;
  const mes=b.filter(x=>R[x.id]).length, conv=b.filter(feito).length;
  return '<div class="cen"><div class="okc">✓</div><h2 class="t">Validação enviada!</h2>'+
    '<p class="sub">'+esc(c.nome)+" — dados registrados.</p></div>"+
    '<div class="kg"><div class="k r"><b>'+hoje+'</b><span>Registrados hoje</span></div>'+
    '<div class="k"><b>'+(b.length-mes)+'</b><span>Pendentes</span></div>'+
    '<div class="k b"><b>'+mes+'</b><span>Registrados no mês</span></div>'+
    '<div class="k g"><b>'+(b.length?Math.round(conv/b.length*100):0)+'%</b><span>Cobertura</span></div></div>'+
    '<button class="cta g" onclick="zap(\''+ultimo+'\')">Compartilhar no WhatsApp</button>'+
    '<button class="cta" onclick="fSt=\'pend\';tela(\'lista\')">+ Próximo cliente</button>'+
    '<button class="cta o" onclick="tela(\'lista\')">Ver fila completa</button>';
}

/* ---------------- WhatsApp ---------------- */
function msg(id){
  const c=baseAtual().filter(x=>x.id===id)[0], v=reg()[id];
  if(!c||!v)return "";
  const L2=[];
  L2.push("🏪 "+c.nome+" | PV "+c.id);
  L2.push("📍 "+String(c.seg).toUpperCase()+" | GC. "+c.gc+" | Rota: "+rotaCod());
  L2.push("");
  L2.push("✅ "+v.status);
  if(EFET[v.status]) c.pil.forEach(p=>L2.push("• "+PILAR[p].n+": "+textoResp(p,(v.resp||{})[p])));
  if(v.modelo)L2.push("• Modelo: "+v.modelo);
  if(v.motivo)L2.push("• Motivo: "+v.motivo);
  if(v.obs)L2.push("📝 "+v.obs);
  L2.push(v.dist!=null?("📌 "+v.dist+" m do PDV cadastrado"):"📌 Localização não capturada");
  if(divergente(v))L2.push("⚠️ Fora do raio do PDV — conferir");
  L2.push("");
  L2.push("🕒 "+v.data+" às "+v.hm+" (Brasília)");
  L2.push("👤 "+(S.nome||S.dev)+" · "+S.dev);
  L2.push("Enviado via "+MARCA+" 🔴");
  return L2.join("\n");
}
function zap(id){
  const txt=msg(id); if(!txt){toast("Registro não encontrado");return;}
  const w=window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank");
  if(!w){ if(navigator.clipboard)navigator.clipboard.writeText(txt); toast("Resumo copiado"); }
}

/* ---------------- parciais ---------------- */
function met(){
  const b=baseAtual(), R=reg();
  const rg=b.filter(c=>R[c.id]);
  const vs=rg.filter(c=>contaVisita(R[c.id]));       // conta no gatilho de 80%
  const efet=rg.filter(c=>EFET[R[c.id].status]);     // conseguiu atender
  const fora=rg.filter(c=>foraDaBase(R[c.id]));      // sai do denominador
  const baseAj=b.length-fora.length;
  const porStatus={}; rg.forEach(c=>{const s=R[c.id].status;porStatus[s]=(porStatus[s]||0)+1;});
  const pil={};
  ORDEM_PIL.forEach(p=>{
    const m=metaDe(S.dev,p); if(!m)return;
    let conv=0, disp=0;
    b.forEach(c=>{
      if(c.pil.indexOf(p)<0)return;
      if(!foraDaBase(R[c.id]))disp++;
      const v=R[c.id]; if(v)conv+=qtdPositiva(p,(v.resp||{})[p]);
    });
    pil[p]={base:disp,oport:m.oport,alvo:m.qtd,pc:m.pc,conv:conv};
  });
  return {base:b.length,baseAj:baseAj,reg:rg.length,vis:vs.length,efet:efet.length,
    fora:fora.length,porStatus:porStatus,pil:pil,
    alvoVis:Math.min(metaVisita(S.dev),Math.round(baseAj*MIN_VIS))};
}
function barra(rot,val,tot,alvo,pc,leg){
  const p=tot?val/tot*100:0, g=(pc||0)*100, ok=val>=alvo;
  return '<div class="barra"><div class="bt"><span>'+esc(rot)+"</span><b>"+val+" / "+alvo+
    ' <span style="opacity:.5">de '+tot+'</span></b></div><div class="track"><div class="fill'+(ok?" ok":"")+
    '" style="width:'+Math.min(100,p)+'%"></div><div class="gate" style="left:'+Math.min(100,g)+'%"></div></div>'+
    '<div class="lg">Meta '+Math.round(g)+"% = "+alvo+(ok?" · atingida":" · faltam "+(alvo-val))+
    (leg?" · "+esc(leg):"")+"</div></div>";
}
function vParc(){
  const m=met(), t=agora(), hj=diaDeHoje();
  const hoje=baseAtual().filter(c=>S.vis[c.id]&&S.vis[c.id].data===t.data).length;
  const planHoje=hj?baseAtual().filter(c=>c.dia===hj).length:0;
  let h='<div class="bar"><b>Parciais · <em>'+esc(S.dev)+'</em></b>'+
    '<button class="mini" onclick="tela(\'lista\')">← Voltar</button></div>';
  h+='<div class="blk hi"><h3>Acompanhamento de cobertura</h3><div class="kg">'+
    '<div class="k r"><b>'+hoje+(planHoje?" / "+planHoje:"")+'</b><span>Hoje '+(hj?"· dia "+hj:"· sem rota")+'</span></div>'+
    '<div class="k b"><b>'+m.vis+'</b><span>Visitas no mês</span></div>'+
    '<div class="k"><b>'+(m.base-m.reg)+'</b><span>Pendentes</span></div>'+
    '<div class="k g"><b>'+(m.baseAj?Math.round(m.efet/m.baseAj*100):0)+'%</b><span>Atendimento</span></div></div></div>';
  h+='<div class="blk"><h3>Seus '+m.reg+' registros do mês</h3>'+
    '<div class="row"><span class="a">Contam no gatilho de visita</span><span class="c2">'+m.vis+"</span></div>"+
    Object.keys(m.porStatus).filter(k=>EFET[k]||CONTA_VISITA.indexOf(k)>=0).map(k=>
      '<div class="row"><span class="a" style="padding-left:12px">'+esc(k)+(EFET[k]?"":" · revisitar")+"</span>"+
      '<span class="b2">'+m.porStatus[k]+"</span></div>").join("")+
    (m.fora?'<div class="row"><span class="a">Retirados da base</span><span class="c2">'+m.fora+"</span></div>"+
      Object.keys(m.porStatus).filter(k=>FORA_DA_BASE.indexOf(k)>=0).map(k=>
        '<div class="row"><span class="a" style="padding-left:12px">'+esc(k)+"</span>"+
        '<span class="b2">'+m.porStatus[k]+"</span></div>").join(""):"")+
    '<p class="note">Ir ao PDV e encontrar fechado ou o comprador ausente conta como visita — '+
    'o deslocamento aconteceu. Só não conta na conversão, que mede venda.'+
    (m.fora?" Os "+m.fora+" retirados saíram do denominador: sua base passou de "+m.base+" para "+m.baseAj+".":"")+
    "</p></div>";
  if(S.sac&&S.sac.tem){
    const dig=(m.pil.DIG?m.pil.DIG.conv:0), fat=S.sac.digital, dif=dig-fat;
    const tx=S.sac.pendentes&&dig?Math.round((dig-S.sac.pendentes.length)/dig*100):0;
    h+='<div class="blk"><h3>Registrado x faturado</h3>'+
      '<div class="kg"><div class="k b"><b>'+dig+'</b><span>você registrou</span></div>'+
      '<div class="k g"><b>'+fat+'</b><span>o SAC faturou</span></div></div>'+
      (dif>0?'<p class="note"><b>'+dif+"</b> cliente(s) que você marcou como cadastro com "+
        "primeira venda ainda não apareceram como compra no app. Vale confirmar se o pedido "+
        "foi concluído.</p>":'<p class="note">Tudo que você registrou já aparece faturado.</p>');
    if(S.sac.pendentes&&S.sac.pendentes.length){
      h+='<div style="margin-top:6px">'+S.sac.pendentes.slice(0,12).map(function(p){
        return '<div class="row"><span class="a">'+esc(p.cliente)+'</span>'+
          '<span class="b2">PV '+esc(p.pv)+"</span></div>";}).join("")+"</div>";
      if(S.sac.pendentes.length>12)
        h+='<p class="note">e mais '+(S.sac.pendentes.length-12)+" cliente(s).</p>";
    }
    h+='<p class="note">Faturamento atualizado em '+esc(S.sac.quando)+
       ". O pedido de hoje pode entrar só na próxima carga.</p></div>";
  }
  h+='<div class="blk"><h3>Gatilho de visita</h3>'+
    barra("Visita da base",m.vis,m.baseAj,m.alvoVis,MIN_VIS,"libera as demais metas")+"</div>";
  h+='<div class="blk"><h3>Metas do mês</h3>';
  ORDEM_PIL.forEach(p=>{const x=m.pil[p]; if(!x)return;
    h+=barra(PILAR[p].n,x.conv,x.oport,x.alvo,x.pc,PILAR[p].d);});
  h+='<p class="note">A régua de cada pilar é a definida para você na planilha de setembro.</p></div>';
  const segs={};
  baseAtual().forEach(c=>{const k=c.seg;if(!segs[k])segs[k]=[0,0];segs[k][1]++;
    if(S.vis[c.id]&&EFET[S.vis[c.id].status])segs[k][0]++;});
  h+='<div class="blk"><h3>Por segmento</h3>'+Object.keys(segs).sort((a,b)=>segs[b][1]-segs[a][1])
    .map(k=>'<div class="row"><span class="a">'+esc(k)+'</span><span class="b2">'+segs[k][0]+"/"+segs[k][1]+
    '</span><span class="c2">'+Math.round(segs[k][0]/segs[k][1]*100)+"%</span></div>").join("")+"</div>";
  const pend=registros().filter(r=>!r._sent).length;
  h+='<div class="blk"><h3>Enviar para o Sheets</h3>'+
    '<button class="cta" style="margin-top:0" onclick="sinc(false)">Sincronizar agora</button>'+
    '<p class="lg">'+(pend?pend+" registro(s) aguardando envio.":"Tudo sincronizado.")+"</p>"+
    '<button class="cta o" onclick="buscarSac(false)">Atualizar faturamento</button>'+
    '<button class="cta o" onclick="csv()">⬇ Baixar CSV</button>'+
    '<p class="lg">Horário sempre em Brasília (UTC−3), independente do relógio do celular.</p></div>';
  return h;
}

/* ---------------- registros, CSV, sync ---------------- */
const COLS=["pv","cliente","desenvolvedor","assinatura","rota","dia_roteiro","data_roteiro","seq_visita",
  "data","hora","data_hora","dia_semana","dia_pedido","oportunidade","segmento","gc","status",
  "digital","gdm1","gdm2","still","ssd","ssd_qtd","modelo_geladeira","motivo","observacao",
  "bairro","cidade","lat_cadastro","lon_cadastro","lat_visita","lon_visita","precisao_m",
  "distancia_m","raio_aceito_m","verificar"];
function registros(){
  const out=[];
  ROTA.forEach(c=>{
    const v=S.vis[c.id]; if(!v)return; const r=v.resp||{};
    out.push({pv:c.id,cliente:c.nome,desenvolvedor:c.dev,assinatura:S.nome,rota:RAW.rotaCod[c.dev]||"",
      dia_roteiro:c.dia,data_roteiro:dataDoDia(c.dia),seq_visita:c.seq,
      data:v.data||"",hora:v.hora||"",data_hora:v.ts||"",dia_semana:v.dow||"",dia_pedido:c.diaTxt,
      oportunidade:c.oport,segmento:c.seg,gc:c.gc,status:v.status||"",
      digital:r.DIG||"",gdm1:r.GDM1||"",gdm2:r.GDM2||"",still:r.STILL||"",
      ssd:textoResp("SSD",r.SSD).replace("—",""),ssd_qtd:qtdPositiva("SSD",r.SSD),
      modelo_geladeira:v.modelo||"",motivo:v.motivo||"",observacao:v.obs||"",
      bairro:c.bairro,cidade:c.cidade,lat_cadastro:c.lat,lon_cadastro:c.lon,
      lat_visita:v.gps?v.gps.lat:"",lon_visita:v.gps?v.gps.lon:"",precisao_m:v.gps?v.gps.acc:"",
      distancia_m:(v.dist!=null?v.dist:""),raio_aceito_m:(v.gps?raioAceito(v.gps.acc):""),
      verificar:verif(v),_sent:!!v.sent});
  });
  return out;
}
function csv(){
  const rs=registros(); if(!rs.length){toast("Nada registrado ainda");return;}
  const l=[COLS.join(";")].concat(rs.map(r=>COLS.map(c=>'"'+String(r[c]==null?"":r[c]).replace(/"/g,'""')+'"').join(";")));
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\ufeff"+l.join("\r\n")],{type:"text/csv;charset=utf-8"}));
  a.download="dmfield_set_"+String(S.dev).replace(/\W/g,"")+"_"+agora().data.replace(/\//g,"")+".csv";
  document.body.appendChild(a);a.click();a.remove();
}
function sinc(sil){
  if(!SYNC_URL||SYNC_URL.indexOf("http")!==0){if(!sil)toast("Configure a URL do Apps Script");return;}
  if(typeof fetch!=="function"){if(!sil)toast("Navegador sem suporte a envio");return;}
  const pend=registros().filter(r=>!r._sent);
  if(!pend.length){if(!sil)toast("Nada novo para enviar");return;}
  const env=pend.map(p=>{const o=Object.assign({},p);delete o._sent;return o;});
  fetch(SYNC_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({visitas:env})})
  .then(()=>{pend.forEach(p=>{if(S.vis[p.pv])S.vis[p.pv].sent=true;});
    save();if(!sil)toast("Enviado: "+pend.length+" registro(s)");render();})
  .catch(()=>{if(!sil)toast("Sem conexão — tente de novo com sinal");});
}
window.addEventListener("online",()=>{sinc(true);buscarSac(true);});

/* ---------------- retorno do faturamento ----------------
   O mesmo endpoint que alimenta o painel devolve, para a carteira
   do desenvolvedor, quais clientes já apareceram faturados no SAC.
   Fica guardado no aparelho, então continua visível sem sinal. */
function buscarSac(silencioso){
  if(!SYNC_URL||SYNC_URL.indexOf("http")!==0)return;
  if(!S.dev)return;
  if(typeof fetch!=="function")return;
  const url=SYNC_URL+"?acao=painel&dev="+encodeURIComponent(S.dev)+"&_="+Date.now();
  fetch(url).then(r=>r.json()).then(function(d){
    if(!d||!d.ok||!d.devs||!d.devs.length)return;
    const x=d.devs[0];
    S.sac={quando:d.atualizado,tem:!!d.temVendas,
           faturados:(x.vendas&&x.vendas.faturados)||[],
           pendentes:(x.vendas&&x.vendas.pendentes)||[],
           digital:(x.vendas&&x.vendas.digital)||0,
           still:(x.vendas&&x.vendas.still)||0,
           ssd:(x.vendas&&x.vendas.ssd)||0};
    save();
    if(scr==="parciais"||scr==="lista")render();
  }).catch(function(){ if(!silencioso)toast("Não deu para buscar o faturamento"); });
}
function faturado(id){
  return !!(S.sac&&S.sac.faturados&&S.sac.faturados.indexOf(String(id))>=0);
}

/* ---------------- start ---------------- */
scr = S.dev && S.nome ? "lista" : "onb";
render();
if(S.dev && navigator.onLine) buscarSac(true);
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
