<style>
:root{
  --red:#E4002B; --red-dk:#CB0028; --ink:#14161A; --ink2:#5A626C; --ink3:#8C939C;
  --line:#E5E8EC; --bg:#F4F5F7; --card:#fff;
  --ok:#0B7A3B; --ok-bg:#E8F6ED; --wa:#B36B00; --wa-bg:#FFF5E1;
  --no:#93131F; --no-bg:#FDECEE; --blue:#1B4E8F; --blue-bg:#EAF1FB;
  --r:14px; --sh:0 1px 2px rgba(20,22,26,.05),0 6px 18px rgba(20,22,26,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--red-dk)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--ink);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}

header{background:var(--red-dk);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 14px;
  display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30}
.hleft h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.hleft h1 span{font-weight:400;opacity:.9}
.hleft p{margin:1px 0 0;font-size:12px;opacity:.85}
.hright{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.pill{background:rgba(255,255,255,.22);border:0;color:#fff;font-size:12px;font-weight:700;
  padding:4px 11px;border-radius:99px}
.btnparc{background:transparent;border:1.5px solid rgba(255,255,255,.6);color:#fff;font-size:13px;
  font-weight:700;padding:6px 13px;border-radius:99px;display:flex;align-items:center;gap:5px}

.sheet{background:var(--bg);border-radius:22px 22px 0 0;min-height:calc(100vh - 96px);
  padding:16px 14px calc(env(safe-area-inset-bottom) + 26px)}

h2.t{margin:6px 0 2px;font-size:24px;font-weight:800;letter-spacing:-.02em}
p.sub{margin:0 0 16px;color:var(--ink2);font-size:14px}
label.f{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}
label.f i{color:var(--red);font-style:normal}
input.tx,select.sel,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);
  border-radius:12px;background:#fff}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.rotacard{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
.rotacard.on{border-color:var(--red);background:#FFF4F6}
.rotacard b{display:block;color:var(--red);font-size:17px;font-weight:800}
.rotacard span{display:block;font-size:11.5px;color:var(--ink2);margin-top:3px}
.cta{width:100%;background:var(--red);color:#fff;border:0;border-radius:14px;padding:16px;
  font-size:16px;font-weight:800;margin-top:18px}
.cta.g{background:#25A244}
.cta.o{background:#fff;color:var(--ink);border:1.5px solid var(--line);font-weight:700}

.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar b{font-size:15px}
.bar b em{font-style:normal;color:var(--red);font-weight:800}
.mini{margin-left:auto;background:#fff;border:1.5px solid var(--line);border-radius:99px;
  padding:8px 13px;font-size:13px;font-weight:600;color:var(--blue)}
.search{width:100%;padding:13px 14px 13px 40px;border:1.5px solid var(--line);border-radius:12px;
  background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%238C939C' stroke-width='2'><circle cx='11' cy='11' r='7'/><path d='m20 20-3.5-3.5'/></svg>") 13px center no-repeat}
.chips{display:flex;gap:8px;overflow-x:auto;padding:11px 0 3px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:#fff;border:1.5px solid var(--line);border-radius:99px;
  padding:9px 15px;font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.chip.dark.on{background:var(--ink);border-color:var(--ink)}
.chip small{font-weight:700;opacity:.65;margin-left:4px}
.abas{display:flex;background:#fff;border:1.5px solid var(--line);border-radius:14px;
  padding:4px;gap:4px;margin:12px 0}
.abas button{flex:1;border:0;background:none;border-radius:11px;padding:11px 4px;font-size:13.5px;
  font-weight:700;color:var(--ink2)}
.abas button.on{background:var(--red);color:#fff}
.abas .n{display:inline-block;background:rgba(0,0,0,.07);border-radius:99px;padding:1px 7px;
  font-size:11.5px;margin-left:4px}
.abas button.on .n{background:rgba(255,255,255,.28);color:#fff}
.count{font-size:12.5px;color:var(--ink2);margin:2px 0 10px}

.c{background:#fff;border-radius:var(--r);box-shadow:var(--sh);margin-bottom:11px;
  border-left:4px solid var(--line);overflow:hidden}
.c.ok{border-left-color:var(--ok)} .c.na{border-left-color:var(--wa)} .c.bx{border-left-color:var(--ink3);opacity:.75}
.ch{display:flex;gap:11px;padding:13px 14px 10px}
.av{flex:0 0 40px;height:40px;border-radius:11px;background:#FDEBEF;color:var(--red);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.cn{font-size:15.5px;font-weight:750;line-height:1.25;word-break:break-word}
.cm{font-size:12px;color:var(--ink3);margin-top:2px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.nav{background:var(--blue-bg);color:var(--blue);font-weight:700;font-size:12px;
  padding:3px 9px;border-radius:99px;text-decoration:none}
.tags{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 12px}
.tg{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:8px;background:var(--bg);color:var(--ink2)}
.tg.pil{background:#FDEBEF;color:#8E0E29} .tg.dia{background:var(--blue-bg);color:var(--blue)}
.tg.pot{background:#FFF3DC;color:#7A4A05} .tg.gc{background:#EEEDFE;color:#3A3287}
.res{margin:0 14px 12px;padding:10px 12px;border-radius:11px;font-size:12.5px;line-height:1.45}
.res.ok{background:var(--ok-bg);color:#0A5F2F} .res.no{background:var(--no-bg);color:var(--no)}
.res.wa{background:var(--wa-bg);color:#8A5300}
.res b{font-weight:800}
.res .q{display:block;font-size:11px;opacity:.85;margin-top:3px}
.acts{display:flex;gap:8px;padding:0 14px 13px}
.acts .b{flex:1;border-radius:11px;padding:12px;font-weight:800;font-size:13.5px;text-align:center;
  border:1.5px solid var(--line);background:#fff;color:var(--ink);text-decoration:none}
.acts .b.p{background:var(--red);border-color:var(--red);color:#fff}
.acts .b.g{background:#25A244;border-color:#25A244;color:#fff}
.acts .b.s{flex:0 0 auto;padding:12px 15px}
.vaz{text-align:center;padding:52px 20px;color:var(--ink2)}
.vaz b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px}

.blk{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:15px;margin-bottom:12px}
.blk.hi{background:#FFF7F8;border:1px solid #FBD9DF}
.blk h3{margin:0 0 12px;font-size:16px;font-weight:800}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:var(--bg);border-radius:11px;padding:12px;text-align:center}
.k b{display:block;font-size:23px;font-weight:800;font-variant-numeric:tabular-nums}
.k span{font-size:12px;color:var(--ink2)}
.k.r b{color:var(--red)} .k.b b{color:var(--blue)} .k.g b{color:var(--ok)}
.track{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;position:relative;margin-top:6px}
.fill{height:100%;background:var(--red);border-radius:99px}
.fill.ok{background:var(--ok)}
.gate{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);opacity:.45}
.bt{display:flex;justify-content:space-between;font-size:13.5px}
.bt b{font-variant-numeric:tabular-nums}
.lg{font-size:11.5px;color:var(--ink2);margin-top:5px}
.barra{margin-bottom:14px}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border:0}
.row .a{color:var(--ink2)} .row .b2{color:var(--ink3);font-variant-numeric:tabular-nums}
.row .c2{font-weight:800;font-variant-numeric:tabular-nums}
.tro{display:flex;gap:4px;margin-top:9px}
.tro span{flex:1;height:17px;border-radius:5px;background:var(--bg);border:1.5px dashed #D6DAE0}
.tro span.on{background:var(--ok);border:0}

.grupo{margin-bottom:20px}
.gl{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:9px}
.gl em{font-style:normal;color:var(--red);text-transform:none;letter-spacing:0;font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:11px;padding:14px;border:1.5px solid var(--line);
  border-radius:12px;background:#fff;font-size:14.5px;font-weight:600;text-align:left;width:100%}
.opt .d{width:19px;height:19px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto}
.opt.on{border-color:var(--ink);background:#FAFBFC}
.opt.on .d{border-color:var(--ink);background:var(--ink);box-shadow:inset 0 0 0 3px #fff}
.opt.on.p{border-color:var(--ok);background:var(--ok-bg)} .opt.on.p .d{border-color:var(--ok);background:var(--ok)}
.opt.on.n{border-color:var(--no);background:var(--no-bg)} .opt.on.n .d{border-color:var(--no);background:var(--no)}
.gps{font-size:12px;color:var(--ink2);background:var(--bg);border-radius:11px;padding:10px 12px}

.okc{width:82px;height:82px;border-radius:50%;background:var(--ok-bg);color:var(--ok);
  display:flex;align-items:center;justify-content:center;font-size:40px;margin:14px auto 16px}
.cen{text-align:center}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);
  color:#fff;padding:12px 20px;border-radius:99px;font-size:14px;font-weight:700;z-index:80;
  opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  catch(e){const d=new Date(Date.now()-108e5);
    p.day=pad(d.getUTCDate());p.month=pad(d.getUTCMonth()+1);p.year=d.getUTCFullYear();
    p.hour=pad(d.getUTCHours());p.minute=pad(d.getUTCMinutes());p.second=pad(d.getUTCSeconds());}
  if(p.hour==="24")p.hour="00";
  const data=p.day+"/"+p.month+"/"+p.year, hora=p.hour+":"+p.minute+":"+p.second;
  const nd=new Date(p.year+"-"+p.month+"-"+p.day+"T12:00:00Z");
  return {data:data,hora:hora,hm:p.hour+":"+p.minute,ts:data+" "+hora,

function hav(a,b,c,d){const R=6371e3,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;
  const h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;

    if(fS==="revisitar"&&(!v||REVISITAR.indexOf(v.status)<0))return false;
    if(fD!=="todos"){
      const ds=c.dias&&c.dias.length?c.dias:diasDe(c.diaTxt);
      if(fD==="hoje"){if(ds.indexOf(hoje)<0)return false;}
      else if(ds.indexOf(+fD)<0)return false;
    }
    if(fP!=="todos"){
      if(aba==="rota"&&c.pil.indexOf(fP)<0)return false;
      if(aba==="geladeira"&&String(c.pot)!==fP)return false;
      if(aba==="recompra"&&c.pil[0]!==fP)return false;
    }
    if(q&&(c.nome+" "+c.id+" "+(c.bairro||"")+" "+(c.end||"")+" "+(c.cidade||"")+" "+(c.seg||"")).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}
function diasDe(t){const m={Seg:1,Ter:2,Qua:3,Qui:4,Sex:5,Sab:6},o=[];

function setResp(p,i){
  const P=PILAR[p], v=P.o[i][0];
  if(!P.multi){ tmp.resp[p]=v; render(); return; }
  let lista = Array.isArray(tmp.resp[p]) ? tmp.resp[p].slice() : [];
  if(v==="Não vendeu"){ lista = lista.indexOf(v)>=0 ? [] : ["Não vendeu"]; }
  else{
    lista = lista.filter(x=>x!=="Não vendeu");

    if(k>=0) lista.splice(k,1); else lista.push(v);

function salvar(){
  if(!tmp.status){toast("Marque a situação da visita");return;}
  if(aba==="rota"&&EFET[tmp.status]){
    const f=cur.pil.filter(p=>{const r=tmp.resp[p];return PILAR[p].multi?!(Array.isArray(r)&&r.length):!r;});
    if(f.length){toast("Responda: "+f.map(p=>PILAR[p].n).join(", "));return;}
  }
  const t=agora();
  tmp.data=t.data;tmp.hora=t.hora;tmp.hm=t.hm;tmp.ts=t.ts;tmp.iso=t.iso;tmp.dow=t.dow;tmp.sent=false;tmp.base=aba;
  const fim=()=>{reg()[cur.id]=tmp;save();ultimo={id:cur.id,base:aba};tela("ok");
    if(navigator.onLine)sinc(true);};
  if(aba==="recompra"&&!tmp.modo){toast("Informe como foi o contato");return;}
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(p=>{
      tmp.gps={lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy||0)};
      tmp.dist=hav(cur.lat,cur.lon,tmp.gps.lat,tmp.gps.lon);fim();},
      e=>{tmp.gps=null;tmp.dist=null;tmp.gpsErro=(e&&e.code===1)?"Permissão negada":"Sinal indisponível";fim();},
      {enableHighAccuracy:true,timeout:10000,maximumAge:0});
  }else{tmp.gps=null;tmp.dist=null;tmp.gpsErro="Aparelho sem GPS";fim();}
}

/* ---------------- parciais ---------------- */
function met(){
  const b=ROTA.filter(c=>c.dev===S.dev), R=S.vis;
  const rg=b.filter(c=>R[c.id]);
  const vs=rg.filter(c=>contaVisita(R[c.id]));          // conta no gatilho de 80%
  const efet=rg.filter(c=>EFET[R[c.id].status]);        // conseguiu atender de fato
  const fora=rg.filter(c=>foraDaBase(R[c.id]));         // sai do denominador
  const baseAj=b.length-fora.length;
  const bx=rg.filter(c=>R[c.id].status==="PDV fechado permanentemente");
  const porStatus={};
  rg.forEach(c=>{const st=R[c.id].status; porStatus[st]=(porStatus[st]||0)+1;});
  const naoAtend=rg.filter(c=>REVISITAR.indexOf(R[c.id].status)>=0).length;
  const pil={}; let conv=0;
  b.forEach(c=>c.pil.forEach(p=>{
    if(!pil[p])pil[p]={base:0,conv:0};
    if(!foraDaBase(R[c.id])) pil[p].base++;
    const v=R[c.id]; if(!v)return;
    const q=qtdPositiva(p,(v.resp||{})[p]);
    pil[p].conv+=q; conv+=q;
  }));
  Object.keys(pil).forEach(p=>{const m=metaPilar(S.dev,p,pil[p].base);pil[p].pc=m.pc;pil[p].alvo=m.alvo;});
  const cp=COB[S.dev]||COB_PAD;
  return {base:b.length,baseAj:baseAj,reg:rg.length,vis:vs.length,efet:efet.length,
    fora:fora.length,bx:bx.length,conv:conv,pil:pil,
    porStatus:porStatus,naoAtend:naoAtend,
    alvoVis:Math.round(baseAj*MIN_VIS),cobPc:cp,alvoCob:Math.round(baseAj*cp)};
}
function barra(rot,val,tot,alvo,pc,leg){

    ' <span style="opacity:.5">de '+tot+'</span></b></div><div class="track"><div class="fill'+(ok?" ok":"")+
    '" style="width:'+Math.min(100,p)+'%"></div><div class="gate" style="left:'+Math.min(100,g)+'%"></div></div>'+
    '<div class="lg">Meta '+Math.round(g)+"% = "+alvo+(ok?" · atingida":" · faltam "+(alvo-val))+
    (leg?" · "+esc(leg):"")+"</div></div>";
}

  const rcB=RECOMPRA.filter(c=>c.dev===S.dev), rcOk=rcB.filter(c=>S.rc[c.id]&&S.rc[c.id].status==="Recomprou").length;
  const premios=Math.floor(rcOk/5), tetos=Math.floor(rcB.length/5);
  const gdB=GELADEIRA.filter(c=>c.dev===S.dev);
  const gdOk=gdB.filter(c=>S.gd[c.id]&&S.gd[c.id].status==="Geladeira instalada").length;
  const gdMeta=RAW.metaGDM[S.dev]||0;
  let h='<div class="bar"><b>Parciais · <em>'+esc(S.dev)+'</em></b>'+
    '<button class="mini" onclick="tela(\'lista\')">← Voltar</button></div>';

    '<div class="k r"><b>'+hoje+'</b><span>Registrados hoje</span></div>'+

    '<div class="k g"><b>'+(m.baseAj?Math.round(m.conv/m.baseAj*100):0)+'%</b><span>Cobertura mês</span></div></div></div>';
  /* De onde vem a diferença entre o que foi registrado e o que conta como visita. */
  h+='<div class="blk"><h3>Seus '+m.reg+' registros do mês</h3>'+
    '<div class="row"><span class="a">Contam no gatilho de visita</span>'+
    '<span class="c2">'+m.vis+"</span></div>"+
    Object.keys(m.porStatus).filter(k=>EFET[k]||CONTA_VISITA.indexOf(k)>=0).map(k=>
      '<div class="row"><span class="a" style="padding-left:12px">'+esc(k)+
      (EFET[k]?"":" · revisitar")+"</span>"+
      '<span class="b2">'+m.porStatus[k]+"</span></div>").join("")+
    (m.fora?'<div class="row"><span class="a">Retirados da base</span><span class="c2">'+m.fora+"</span></div>"+
      Object.keys(m.porStatus).filter(k=>FORA_DA_BASE.indexOf(k)>=0).map(k=>
        '<div class="row"><span class="a" style="padding-left:12px">'+esc(k)+"</span>"+
        '<span class="b2">'+m.porStatus[k]+"</span></div>").join(""):"")+
    '<p class="note">Ir ao PDV e encontrar fechado ou o comprador ausente conta como visita — '+
    'o deslocamento aconteceu. Só não conta na cobertura, que mede venda. '+
    'Esses clientes ficam no filtro <b>Revisitar</b>.'+
    (m.fora?" Os "+m.fora+" retirados saíram do denominador: sua base passou de "+m.base+
      " para "+m.baseAj+".":"")+"</p></div>";
  h+='<div class="blk"><h3>Gatilhos mínimos</h3>'+
    barra("Visita da base",m.vis,m.baseAj,m.alvoVis,MIN_VIS)+
    barra("Cobertura total",m.conv,m.baseAj,m.alvoCob,m.cobPc)+"</div>";
  h+='<div class="blk"><h3>Meta por pilar</h3>';
  Object.keys(m.pil).forEach(p=>{const x=m.pil[p];h+=barra(PILAR[p].n,x.conv,x.base,x.alvo,x.pc,PILAR[p].d);});
  h+="</div>";
  h+='<div class="blk"><h3>Desafio recompra</h3><div class="bt"><span>Bateu levou</span><b>'+rcOk+" / "+rcB.length+
    '</b></div><div class="track"><div class="fill'+(premios?" ok":"")+'" style="width:'+
    (rcB.length?Math.min(100,rcOk/rcB.length*100):0)+'%"></div></div><div class="tro">'+
    Array.from({length:tetos},(_,i)=>'<span class="'+(i<premios?"on":"")+'"></span>').join("")+"</div>"+
    '<div class="lg">'+premios+" prêmio(s) · faltam "+((premios+1)*5-rcOk)+" recompras para o próximo</div></div>";
  const oport=RAW.oportGDM[S.dev]||0, ind=gdMeta?oport/gdMeta:0;
  const sinal=ind>=1.15?["Carteira acima da meta","Dá para ir além do mínimo",""]:
    (ind<=0.85?["Carteira apertada","Meta exige aproveitar quase toda oportunidade",""]:
    ["Carteira pareada com a meta","",""]);
  h+='<div class="blk"><h3>Desafio geladeira</h3>'+
    barra("Instalação",gdOk,gdB.length,gdMeta,gdMeta/Math.max(1,gdB.length),"meta nivelada")+
    '<div class="row"><span class="a">PDVs na sua carteira</span><span class="c2">'+gdB.length+"</span></div>"+
    '<div class="row"><span class="a">Alto potencial</span><span class="c2">'+gdB.filter(c=>c.pot===2).length+"</span></div>"+
    '<div class="row"><span class="a">Oportunidade estimada</span><span class="c2">'+oport+"</span></div>"+
    '<div class="row"><span class="a">Índice oportunidade ÷ meta</span><span class="c2">'+ind.toFixed(2)+"</span></div>"+
    '<div class="lg" style="margin-top:8px">'+esc(sinal[0])+(sinal[1]?" · "+esc(sinal[1]):"")+
    ". A meta é igual para todos; a oportunidade varia com a região.</div></div>";
  const segs={};
  ROTA.filter(c=>c.dev===S.dev).forEach(c=>{const k=c.seg;if(!segs[k])segs[k]=[0,0];segs[k][1]++;
    if(S.vis[c.id]&&EFET[S.vis[c.id].status])segs[k][0]++;});
  h+='<div class="blk"><h3>Por segmento</h3>'+Object.keys(segs).sort((a,b)=>segs[b][1]-segs[a][1])
    .map(k=>'<div class="row"><span class="a">'+esc(k)+'</span><span class="b2">'+segs[k][0]+"/"+segs[k][1]+
    '</span><span class="c2">'+Math.round(segs[k][0]/segs[k][1]*100)+"%</span></div>").join("")+"</div>";
  const pend=registros().filter(r=>!r._sent).length;
  h+='<div class="blk"><h3>Enviar para o Sheets</h3>'+
    '<button class="cta" style="margin-top:0" onclick="sinc(false)">Sincronizar agora</button>'+
    '<p class="lg">'+(pend?pend+" registro(s) aguardando envio.":"Tudo sincronizado.")+"</p>"+
    '<button class="cta o" onclick="csv()">⬇ Baixar CSV</button>'+
    '<p class="lg">Horário sempre em Brasília (UTC−3), independente do relógio do celular.</p></div>';
  return h;
}

/* ---------------- registros, CSV, sync ---------------- */
const COLS=["base","pv","cliente","desenvolvedor","assinatura","rota","data","hora","data_hora","dia_semana",
  "dia_visita","categoria","segmento","gc","status","digital","cerveja","destilados","bomboniere","artd",
  "still","ssd","ssd_qtd","modelo_geladeira","giro_cx_mes","potencial","motivo","observacao","bairro","cidade",
  "lat_cadastro","lon_cadastro","lat_visita","lon_visita","precisao_m","modo_contato","distancia_m",
  "raio_aceito_m","verificar"];
function verif(bn,v){
  if(v.gps==null)return "SEM GPS";
  if(!presencial(bn,v))return "";
  return divergente(v)?"SIM":"";
}
function registros(){
  const out=[];
  [["rota",ROTA,S.vis],["recompra",RECOMPRA,S.rc],["geladeira",GELADEIRA,S.gd]].forEach(([bn,arr,R])=>{
    arr.forEach(c=>{
      const v=R[c.id]; if(!v)return; const r=v.resp||{};
      out.push({base:bn,pv:c.id,cliente:c.nome,desenvolvedor:c.dev,assinatura:S.nome,rota:RAW.rotaCod[c.dev]||"",
        data:v.data||"",hora:v.hora||"",data_hora:v.ts||"",dia_semana:v.dow||"",dia_visita:c.diaTxt||"",
        categoria:c.cat||c.catTxt||"",segmento:c.seg||"",gc:c.gc||"",status:v.status||"",
        digital:r.DIG||"",cerveja:r.CERV||"",destilados:r.DEST||"",bomboniere:r.BOMB||"",artd:r.ARTD||"",
        still:r.STILL||"",ssd:textoResp("SSD",r.SSD).replace("—",""),ssd_qtd:qtdPositiva("SSD",r.SSD),modelo_geladeira:v.modelo||"",giro_cx_mes:(c.giro!=null?c.giro:""),
        potencial:(c.pot!=null?POTN[c.pot]:""),motivo:v.motivo||"",observacao:v.obs||"",
        bairro:c.bairro||"",cidade:c.cidade||"",lat_cadastro:c.lat,lon_cadastro:c.lon,
        lat_visita:v.gps?v.gps.lat:"",lon_visita:v.gps?v.gps.lon:"",precisao_m:v.gps?v.gps.acc:"",
        modo_contato:v.modo||(bn==="recompra"?"":"Presencial no PDV"),
        distancia_m:(v.dist!=null?v.dist:""),
        raio_aceito_m:(v.gps?raioAceito(v.gps.acc):""),
        verificar:verif(bn,v),
        _sent:!!v.sent,_b:bn});
    });
  });
  return out;
}
function csv(){
  const rs=registros(); if(!rs.length){toast("Nada registrado ainda");return;}
  const l=[COLS.join(";")].concat(rs.map(r=>COLS.map(c=>'"'+String(r[c]==null?"":r[c]).replace(/"/g,'""')+'"').join(";")));
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\ufeff"+l.join("\r\n")],{type:"text/csv;charset=utf-8"}));
  a.download="dmfield_"+String(S.dev).replace(/\W/g,"")+"_"+agora().data.replace(/\//g,"")+".csv";
  document.body.appendChild(a);a.click();a.remove();
}
function marcar(p){const R=p._b==="rota"?S.vis:(p._b==="recompra"?S.rc:S.gd); if(R[p.pv])R[p.pv].sent=true;}
function sinc(sil){
  if(!SYNC_URL||SYNC_URL.indexOf("http")!==0){if(!sil)toast("Configure a URL do Apps Script");return;}
  if(typeof fetch!=="function"){if(!sil)toast("Navegador sem suporte a envio");return;}
  const pend=registros().filter(r=>!r._sent);
  if(!pend.length){if(!sil)toast("Nada novo para enviar");return;}
  const env=pend.map(p=>{const o=Object.assign({},p);delete o._sent;delete o._b;return o;});
  fetch(SYNC_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({visitas:env})})
  .then(()=>{pend.forEach(marcar);save();if(!sil)toast("Enviado: "+pend.length+" registro(s)");render();})
  .catch(()=>{if(!sil)toast("Sem conexão — tente de novo com sinal");});
}
window.addEventListener("online",()=>sinc(true));

/* ---------------- start ---------------- */
scr = S.dev && S.nome ? "lista" : "onb";
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
